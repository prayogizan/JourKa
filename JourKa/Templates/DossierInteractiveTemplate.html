<!DOCTYPE html>
<!-- TODO(JK-FE-003): Replace with full interactive app shell, theme tokens, Bento grid, accordions, steppers, citations, TOC, and search -->
<html lang="{{LANG_CODE}}" data-jourka-ui="v2" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DOC_TITLE}}</title>
  <style>
    @page { size: A4; margin: 16mm 15mm 16mm 15mm; }
    body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; line-height: 1.68; color: #1e293b; max-width: 860px; margin: 0 auto; padding: 20px 16px; font-size: 13.5px; }
    .banner { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #ffffff; padding: 24px 28px; border-radius: 10px; margin-bottom: 22px; }
    .banner-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .banner h1 { color: #ffffff; border: none; margin: 0 0 8px 0; padding: 0; font-size: 24px; letter-spacing: -0.3px; }
    .banner .meta { font-size: 12.5px; color: #cbd5e1; display: flex; flex-wrap: wrap; gap: 10px; }
    .banner .pill { background: rgba(255,255,255,0.14); padding: 3px 10px; border-radius: 999px; font-weight: 600; color: #f8fafc; }
    .lang-switch { background: rgba(255,255,255,0.18); color: #ffffff; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(255,255,255,0.28); }
    .lang-switch:hover { background: rgba(255,255,255,0.28); }
    h1 { font-size: 22px; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 6px; margin-top: 24px; }
    h2 { font-size: 16.5px; color: #1e3a8a; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-top: 24px; }
    h3 { font-size: 14.5px; color: #0f172a; margin-top: 18px; }
    p { color: #334155; margin: 10px 0; text-align: left; }
    li { color: #334155; margin-bottom: 6px; }
    ul, ol { padding-left: 22px; margin: 8px 0 14px 0; }
    table { border-collapse: collapse; width: 100%; margin: 14px 0 18px 0; font-size: 12.2px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #f1f5f9; color: #0f172a; font-weight: 700; }
    tr:nth-child(even) td { background: #f8fafc; }
    blockquote { border-left: 4px solid #2563eb; background: #eff6ff; margin: 14px 0; padding: 10px 14px; border-radius: 0 6px 6px 0; color: #1e3a8a; }
    code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 12px; color: #0f172a; }
    a { color: #2563eb; text-decoration: none; word-break: break-all; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="banner">
    <div class="banner-top">
      <h1>{{ROLE_NAME}} &#x2014; {{BANNER_SUFFIX}}</h1>
      <a class="lang-switch" href="{{COUNTERPART_HREF}}">{{COUNTERPART_LABEL}}</a>
    </div>
    <div class="meta">{{META_PILLS_HTML}}</div>
  </div>
  <div id="c"></div>
  <textarea id="m" style="display:none;">{{MARKDOWN_ENCODED}}</textarea>
  <script>
    (function () {
      var raw = document.getElementById('m').value;
      var target = document.getElementById('c');
      if (window.marked && typeof window.marked.parse === 'function') {
        target.innerHTML = window.marked.parse(raw);
      } else {
        var pre = document.createElement('pre');
        pre.style.whiteSpace = 'pre-wrap';
        pre.textContent = raw;
        target.appendChild(pre);
      }
    })();
  </script>
</body>
</html>
