<!DOCTYPE html>
<html lang="{{LANG_CODE}}" data-jourka-ui="v2" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{DOC_TITLE}}</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('jourka_theme'); } catch (e) { }
      var sysDark = false;
      try { sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { }
      var theme = (stored === 'dark' || stored === 'light') ? stored : (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) { meta.setAttribute('content', (stored === 'dark' || stored === 'light') ? stored : 'light dark'); }
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-toolbar: rgba(255, 255, 255, 0.84);
      --border: #e2e8f0;
      --border-control: #64748b;
      --ink-primary: #0f172a;
      --ink-body: #334155;
      --ink-muted: #64748b;
      --ink-muted-subtle: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --emerald: #059669;
      --emerald-text: #047857;
      --emerald-soft: #ecfdf5;
      --amber: #d97706;
      --amber-text: #b45309;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-text: #be123c;
      --rose-soft: #fff1f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      --toolbar-h: 60px;
      --font-sans: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-canvas: #0b1120;
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --bg-toolbar: rgba(17, 24, 39, 0.84);
      --border: #1f2937;
      --border-control: #64748b;
      --ink-primary: #f8fafc;
      --ink-body: #cbd5e1;
      --ink-muted: #94a3b8;
      --ink-muted-subtle: #cbd5e1;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --accent-soft: #172554;
      --emerald: #34d399;
      --emerald-text: #6ee7b7;
      --emerald-soft: #064e3b;
      --amber: #fbbf24;
      --amber-text: #fcd34d;
      --amber-soft: #451a03;
      --rose: #fb7185;
      --rose-text: #fda4af;
      --rose-soft: #4c0519;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      overflow-x: clip;
      scroll-behavior: smooth;
      accent-color: var(--accent);
      scrollbar-color: var(--border-control) transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: clip;
      background-color: var(--bg-canvas);
      color: var(--ink-body);
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }

    /* Accessibility utilities */
    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    .skip-link {
      position: fixed;
      inset-block-start: 10px;
      inset-inline-start: 12px;
      z-index: 200;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--ink-primary);
      border: 2px solid var(--accent);
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      box-shadow: var(--shadow-md);
    }

    :where(a:any-link, button, input, [tabindex="0"]):focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* Fixed 3px Reading Progress Bar */
    .reading-progress {
      position: fixed;
      inset-block-start: 0;
      inset-inline: 0;
      block-size: 3px;
      background: var(--accent);
      transform-origin: 0 50%;
      transform: scaleX(0);
      z-index: 120;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      @supports (animation-timeline: scroll()) {
        @keyframes jourka-scroll-progress {
          from {
            transform: scaleX(0);
          }

          to {
            transform: scaleX(1);
          }
        }

        .reading-progress {
          animation: jourka-scroll-progress auto linear both;
          animation-timeline: scroll(root block);
        }
      }
    }

    /* Sticky Glassmorphism App Toolbar */
    .app-toolbar {
      position: sticky;
      inset-block-start: 0;
      z-index: 90;
      min-block-size: var(--toolbar-h);
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @supports not ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
      .app-toolbar {
        background: var(--bg-surface);
      }
    }

    .toolbar-inner {
      max-width: 1240px;
      margin-inline: auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .toolbar-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 28px;
      block-size: 28px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.8125rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toolbar-role-badge {
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-inline-size: 220px;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .segmented-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-muted-subtle);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-block-size: 28px;
      line-height: 1;
    }

    .seg-btn[aria-current="true"],
    .seg-btn.is-active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: var(--shadow-sm);
    }

    .seg-btn[aria-disabled="true"] {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .toolbar-search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .toolbar-search {
      inline-size: 170px;
      min-block-size: 32px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-control);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.8125rem;
    }

    .toolbar-search::placeholder {
      color: var(--ink-muted);
    }

    .toolbar-search[aria-disabled="true"] {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .tool-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-block-size: 32px;
      min-inline-size: 32px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-control);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .tool-btn:hover {
      background: var(--bg-subtle);
    }

    .tool-btn svg {
      inline-size: 16px;
      block-size: 16px;
      flex-shrink: 0;
    }

    /* Theme icon visibility driven purely by html[data-theme] */
    :root[data-theme="light"] .icon-sun {
      display: none;
    }

    :root[data-theme="dark"] .icon-moon {
      display: none;
    }

    /* Responsive 2-Column Workspace */
    .app-workspace {
      max-width: 1240px;
      margin-inline: auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 260px minmax(0, 880px);
      gap: 28px;
      justify-content: center;
      align-items: start;
    }

    .toc-sidebar {
      position: sticky;
      inset-block-start: calc(var(--toolbar-h) + 20px);
      max-block-size: calc(100vh - var(--toolbar-h) - 40px);
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .toc-heading {
      margin: 0 0 12px 0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toc-link {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      color: var(--ink-body);
      text-decoration: none;
      font-size: 0.8125rem;
      line-height: 1.4;
      font-weight: 500;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .toc-link:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .toc-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .main-canvas {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Upgraded Hero Banner */
    .banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 26px 28px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    :root[data-theme="dark"] .banner {
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
      border-color: #1e293b;
    }

    .banner-eyebrow {
      margin: 0 0 6px 0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cbd5e1;
    }

    .banner h1 {
      margin: 0 0 14px 0;
      padding: 0;
      border: 0;
      color: #ffffff;
      font-size: clamp(1.375rem, 2.2vw, 1.75rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .banner .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.75rem;
    }

    .banner .pill {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #f8fafc;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      line-height: 1.3;
    }

    .hero-vitals {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .vital-sep {
      color: #94a3b8;
    }

    /* Reserved Tier 0 Bento Slot (JK-FE-005) */
    .bento-slot[hidden] {
      display: none;
    }

    /* Editorial Content Surface */
    .dossier-content {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }

    .dossier-content h1 {
      font-size: 1.375rem;
      color: var(--ink-primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin: 24px 0 12px 0;
    }

    .dossier-content h2 {
      font-size: 1.1875rem;
      color: var(--ink-primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin: 28px 0 12px 0;
      scroll-margin-top: calc(var(--toolbar-h) + 24px);
    }

    .dossier-content h2:first-child {
      margin-top: 4px;
    }

    .dossier-content h3 {
      font-size: 1rem;
      color: var(--ink-primary);
      margin: 20px 0 8px 0;
    }

    .dossier-content h4 {
      font-size: 0.9375rem;
      color: var(--ink-primary);
      margin: 16px 0 6px 0;
    }

    .dossier-content p {
      color: var(--ink-body);
      margin: 10px 0;
    }

    .dossier-content ul,
    .dossier-content ol {
      padding-left: 22px;
      margin: 8px 0 14px 0;
    }

    .dossier-content li {
      color: var(--ink-body);
      margin-bottom: 6px;
    }

    .dossier-content a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      overflow-wrap: anywhere;
    }

    .dossier-content a:hover {
      color: var(--accent-hover);
    }

    .dossier-content blockquote {
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      margin: 14px 0;
      padding: 12px 16px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--ink-primary);
    }

    .dossier-content code {
      background: var(--bg-subtle);
      color: var(--ink-primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
    }

    .dossier-content pre {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      max-width: 100%;
      margin: 14px 0;
    }

    .dossier-content pre code {
      background: transparent;
      padding: 0;
    }

    .markdown-fallback {
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      line-height: 1.55;
      color: var(--ink-body);
    }

    /* Responsive Table Wrapper */
    .table-wrapper {
      overflow-x: auto;
      max-inline-size: 100%;
      margin: 14px 0 18px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
    }

    .dossier-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 0;
      font-size: 0.8125rem;
    }

    .dossier-content th,
    .dossier-content td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 9px 12px;
      text-align: left;
      vertical-align: top;
    }

    .dossier-content th:last-child,
    .dossier-content td:last-child {
      border-right: 0;
    }

    .dossier-content tbody tr:last-child td {
      border-bottom: 0;
    }

    .dossier-content thead th {
      background: var(--bg-subtle);
      color: var(--ink-primary);
      font-weight: 700;
    }

    .dossier-content tbody tr:nth-child(even) td {
      background: var(--bg-canvas);
    }

    .dossier-content th.col-align-left,
    .dossier-content td.col-align-left {
      text-align: left;
    }

    .dossier-content th.col-align-center,
    .dossier-content td.col-align-center {
      text-align: center;
    }

    .dossier-content th.col-align-right,
    .dossier-content td.col-align-right {
      text-align: right;
    }

    .dossier-section {
      min-width: 0;
    }

    /* Footer */
    .app-footer {
      max-width: 1240px;
      margin-inline: auto;
      padding: 0 24px 36px 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-muted);
    }

    /* Mobile Floating TOC FAB & Native <dialog> Drawer */
    .toc-fab {
      display: none;
      position: fixed;
      inset-block-end: 20px;
      inset-inline-end: 20px;
      z-index: 95;
      align-items: center;
      gap: 8px;
      min-block-size: 48px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--ink-primary);
      color: var(--bg-surface);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }

    .toc-fab svg {
      inline-size: 18px;
      block-size: 18px;
    }

    dialog.toc-drawer {
      margin: auto auto 0 auto;
      inline-size: min(100vw, 560px);
      max-inline-size: 100vw;
      max-block-size: 78vh;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      background: var(--bg-surface);
      color: var(--ink-body);
      padding: 18px 20px 24px 20px;
      box-shadow: var(--shadow-md);
    }

    dialog.toc-drawer::backdrop {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--ink-primary);
    }

    @media (max-width: 1023px) {
      .toolbar-inner {
        padding: 10px 16px;
      }

      .app-workspace {
        display: block;
        padding: 16px;
        max-width: 880px;
      }

      .toc-sidebar {
        display: none;
      }

      .toc-fab {
        display: inline-flex;
      }

      .dossier-content {
        padding: 18px 16px;
      }

      .banner {
        padding: 20px 18px;
      }

      .app-footer {
        padding: 8px 16px 84px 16px;
      }
    }

    @media (max-width: 639px) {

      .toolbar-search-wrap,
      #view-mode-group {
        display: none;
      }

      .toolbar-role-badge {
        max-inline-size: 145px;
      }
    }

    @media (pointer: coarse) {

      .tool-btn,
      .seg-btn {
        min-block-size: 40px;
      }

      .toc-link {
        padding: 10px 12px;
      }
    }

    @media (forced-colors: active) {

      .app-toolbar,
      .toc-sidebar,
      .dossier-content,
      .banner,
      .table-wrapper,
      .tool-btn,
      .toc-fab {
        border: 1px solid CanvasText;
      }

      :where(a:any-link, button, input, [tabindex="0"]):focus-visible {
        outline: 2px solid Highlight;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 14mm;
      }

      body {
        background: #ffffff;
        color: #0f172a;
      }

      .reading-progress,
      .app-toolbar,
      .toc-sidebar,
      .toc-fab,
      .toc-drawer,
      .skip-link,
      .app-footer {
        display: none !important;
      }

      .app-workspace {
        display: block;
        padding: 0;
        max-width: none;
      }

      .dossier-content {
        border: 0;
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <a href="#main-content" class="skip-link visually-hidden" id="skip-link">Skip to main content</a>
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>

  <header id="app-toolbar" class="app-toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-brand">
        <span class="toolbar-mark" aria-hidden="true">JK</span>
        <span id="toolbar-role" class="toolbar-role-badge">{{ROLE_NAME}}</span>
      </div>

      <div class="toolbar-controls">
        <div id="view-mode-group" class="segmented-group" role="group" aria-label="View mode">
          <button type="button" class="seg-btn is-active" data-view-mode="compact" aria-disabled="true">Compact</button>

  <script>
    (function () {
      var docEl = document.documentElement;
      var lang = (docEl.getAttribute('lang') || 'en').toLowerCase().indexOf('id') === 0 ? 'id' : 'en';

      var SHELL_I18N = {
        en: {
          skip: 'Skip to main content',
          contents: 'Contents',
          sections: 'Sections',
          close: 'Close',
          searchLabel: 'Search dossier',
          searchPlaceholder: 'Search (Ctrl+K)',
          compact: 'Compact',
          expandAll: 'Expand All',
          themeToggle: 'Toggle Light or Dark theme',
          print: 'Print dossier',
          tableRegion: 'Scrollable data table',
          vitals: function (s, m, y) { return [s + ' Sections', '~' + m + ' min read', y + ' Verified Sources']; }
        },
        id: {
          skip: 'Langsung ke konten utama',
          contents: 'Daftar Isi',
          sections: 'Bagian',
          close: 'Tutup',
          searchLabel: 'Cari dosier',
          searchPlaceholder: 'Cari (Ctrl+K)',
          compact: 'Ringkas',
          expandAll: 'Buka Semua',
          themeToggle: 'Ubah tema Terang atau Gelap',
          print: 'Cetak dosier',
          tableRegion: 'Tabel data dapat digulir',
          vitals: function (s, m, y) { return [s + ' Bagian', '~' + m + ' mnt baca', y + ' Sumber Terverifikasi']; }
        }
      };

      var t = SHELL_I18N[lang];

      function applyShellLabels() {
        var skip = document.getElementById('skip-link');
        if (skip) skip.textContent = t.skip;
        var tocHeading = document.getElementById('toc-heading');
        if (tocHeading) tocHeading.textContent = t.contents;
        var fabLabel = document.getElementById('toc-fab-label');
        if (fabLabel) fabLabel.textContent = t.sections;
        var drawerTitle = document.getElementById('toc-drawer-title');
        if (drawerTitle) drawerTitle.textContent = t.sections;
        var drawerClose = document.getElementById('toc-drawer-close');
        if (drawerClose) drawerClose.textContent = t.close;
        var searchLabel = document.getElementById('search-label');
        if (searchLabel) searchLabel.textContent = t.searchLabel;
        var searchInput = document.getElementById('dossier-search');
        if (searchInput) searchInput.setAttribute('placeholder', t.searchPlaceholder);
        var btnCompact = document.querySelector('[data-view-mode="compact"]');
        if (btnCompact) btnCompact.textContent = t.compact;
        var btnExpand = document.querySelector('[data-view-mode="expand"]');
        if (btnExpand) btnExpand.textContent = t.expandAll;
        var activeLangEl = document.querySelector('[data-lang-active]');
        if (activeLangEl) activeLangEl.textContent = lang === 'id' ? 'ID' : 'EN';
        var themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) themeBtn.setAttribute('aria-label', t.themeToggle);
        var printBtn = document.getElementById('print-btn');
        if (printBtn) printBtn.setAttribute('aria-label', t.print);
      }

      function getSystemTheme() {
        try {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {
          return 'light';
        }
      }

      function getTheme() {
        return docEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }

      function setTheme(nextTheme, persist) {
        var resolved = nextTheme === 'dark' ? 'dark' : 'light';
        docEl.setAttribute('data-theme', resolved);
        var meta = document.querySelector('meta[name="color-scheme"]');
        var btn = document.getElementById('theme-toggle');
        if (btn) btn.setAttribute('aria-pressed', resolved === 'dark' ? 'true' : 'false');
        if (persist) {
          var sys = getSystemTheme();
          try {
            if (resolved !== sys) {
              localStorage.setItem('jourka_theme', resolved);
              if (meta) meta.setAttribute('content', resolved);
            } else {
              localStorage.removeItem('jourka_theme');
              if (meta) meta.setAttribute('content', 'light dark');
            }
          } catch (e) {
            if (meta) meta.setAttribute('content', resolved);
          }
        }
      }

      function initThemeController() {
        setTheme(getTheme(), false);
        var toggleBtn = document.getElementById('theme-toggle');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', function () {
            var next = getTheme() === 'dark' ? 'light' : 'dark';
            setTheme(next, true);
          });
        }
        try {
          if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var onMediaChange = function (ev) {
              var stored = null;
              try { stored = localStorage.getItem('jourka_theme'); } catch (e) { }
              if (stored !== 'light' && stored !== 'dark') {
                setTheme(ev.matches ? 'dark' : 'light', false);
              }
            };
            if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onMediaChange);
            else if (typeof mq.addListener === 'function') mq.addListener(onMediaChange);
          }
        } catch (e) { }
        window.addEventListener('storage', function (ev) {
          if (ev.key === 'jourka_theme') {
            var next = (ev.newValue === 'dark' || ev.newValue === 'light') ? ev.newValue : getSystemTheme();
            setTheme(next, false);
          }
        });
      }

      function initReadingProgressFallback() {
        var supportsTimeline = false;
        try {
          supportsTimeline = !!(window.CSS && CSS.supports && CSS.supports('animation-timeline', 'scroll()'));
        } catch (e) { }
        if (supportsTimeline) return;
        var bar = document.getElementById('reading-progress');
        if (!bar) return;
        var ticking = false;
        var update = function () {
          ticking = false;
          var scrollable = document.documentElement.scrollHeight - window.innerHeight;
          var ratio = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 0;
          bar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
        };
        var schedule = function () {
          if (!ticking) {
            ticking = true;
            window.requestAnimationFrame(update);
          }
        };
        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule, { passive: true });
        update();
      }

      function updateVitals(stats) {
        var el = document.getElementById('hero-vitals');
        if (!el || !stats) return;
        el.replaceChildren();
        var parts = t.vitals(stats.sections, stats.readMins, stats.sources);
        for (var i = 0; i < parts.length; i++) {
          if (i > 0) {
            var sep = document.createElement('span');
            sep.className = 'vital-sep';
            sep.setAttribute('aria-hidden', 'true');
            sep.textContent = '\u00B7';
            el.appendChild(sep);
          }
          var item = document.createElement('span');
          item.textContent = parts[i];
          el.appendChild(item);
        }
      }

      function wrapTables(root) {
        if (!root) return;
        var tables = root.querySelectorAll('table');
        for (var i = 0; i < tables.length; i++) {
          var tbl = tables[i];
          if (tbl.parentElement && tbl.parentElement.classList.contains('table-wrapper')) continue;
          var wrap = document.createElement('div');
          wrap.className = 'table-wrapper';
          wrap.setAttribute('tabindex', '0');
          wrap.setAttribute('role', 'region');
          wrap.setAttribute('aria-label', t.tableRegion + ' ' + (i + 1));
          tbl.parentNode.insertBefore(wrap, tbl);
          wrap.appendChild(tbl);
        }
      }

      function populateBasicToc(root) {
        if (!root) return;
        var headings = root.querySelectorAll('h2');
        var desktopList = document.getElementById('toc-list');
        var drawerList = document.getElementById('toc-drawer-list');
        if (desktopList) desktopList.replaceChildren();
        if (drawerList) drawerList.replaceChildren();

        for (var i = 0; i < headings.length; i++) {
          var h = headings[i];
          if (!h.id) h.id = 'section-' + (i + 1);
          var rawText = (h.textContent || '').trim();
          var cleanText = rawText.replace(/^\d+\.\s*/, '');
          var num = (i + 1 < 10 ? '0' : '') + (i + 1);

          var makeItem = function (isDrawer) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.className = 'toc-link';
            a.href = '#' + h.id;
            var badge = document.createElement('span');
            badge.className = 'toc-num';
            badge.textContent = num;
            var label = document.createElement('span');
            label.textContent = cleanText;
            a.appendChild(badge);
            a.appendChild(label);
            if (isDrawer) {
              a.addEventListener('click', function () { closeTocDrawer(); });
            }
            li.appendChild(a);
            return li;
          };

          if (desktopList) desktopList.appendChild(makeItem(false));
          if (drawerList) drawerList.appendChild(makeItem(true));
        }
      }

      function closeTocDrawer() {
        var drawer = document.getElementById('toc-drawer');
        if (drawer && drawer.open) drawer.close();
      }

      function initDrawerAndPrint() {
        var fab = document.getElementById('toc-fab');
        var drawer = document.getElementById('toc-drawer');
        var closeBtn = document.getElementById('toc-drawer-close');
        if (fab && drawer) {
          fab.addEventListener('click', function () {
            if (typeof drawer.showModal === 'function') drawer.showModal();
            else drawer.setAttribute('open', '');
          });
          drawer.addEventListener('click', function (ev) {
            if (ev.target === drawer) closeTocDrawer();
          });
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', closeTocDrawer);
        }
        var printBtn = document.getElementById('print-btn');
        if (printBtn) {
          printBtn.addEventListener('click', function () { window.print(); });
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function splitPipeCells(line) {
        var trimmed = line.trim();
        if (trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
        if (trimmed.length > 0 && trimmed.charAt(trimmed.length - 1) === '|' && trimmed.charAt(trimmed.length - 2) !== '\\') {
          trimmed = trimmed.slice(0, -1);
        }
        var cells = [];
        var buf = '';
        var inCode = false;
        for (var i = 0; i < trimmed.length; i++) {
          var ch = trimmed.charAt(i);
          if (ch === '\\' && i + 1 < trimmed.length && trimmed.charAt(i + 1) === '|') {
            buf += '\\|';
            i++;
            continue;
          }
          if (ch === '`') {
            inCode = !inCode;
            buf += ch;
            continue;
          }
          if (ch === '|' && !inCode) {
            cells.push(buf.trim());
            buf = '';
            continue;
          }
          buf += ch;
        }
        cells.push(buf.trim());
        return cells;
      }

      function isTableSeparatorLine(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line) ||
          /^\s*\|\s*:?-{3,}:?\s*\|\s*$/.test(line);
      }

      function normalizeMarkdownInput(rawMd) {
        var text = String(rawMd || '');
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        var lines = text.split('\n');
        var out = [];
        var inFence = false;
        var fenceChar = '';
        var fenceLen = 0;
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];
          var fenceMatch = line.match(/^\s*(```+|~~~+)/);
          if (fenceMatch) {
            var marker = fenceMatch[1];
            if (!inFence) {
              inFence = true;
              fenceChar = marker.charAt(0);
              fenceLen = marker.length;
            } else if (marker.charAt(0) === fenceChar && marker.length >= fenceLen && line.trim().length === marker.length) {
              inFence = false;
            }
            out.push(line);
            i++;
            continue;
          }

          if (!inFence && i + 1 < lines.length && line.indexOf('|') !== -1 && isTableSeparatorLine(lines[i + 1])) {
            var hdrCells = splitPipeCells(line);
            var sepCells = splitPipeCells(lines[i + 1]);
            if (hdrCells.length >= 2 && sepCells.length === hdrCells.length) {
              var colCount = hdrCells.length;
              out.push(line);
              out.push(lines[i + 1]);
              i += 2;
              while (i < lines.length) {
                var rowLine = lines[i];
                if (!rowLine.trim() || rowLine.indexOf('|') === -1 || /^\s*(```+|~~~+|#{1,6}\s|>\s?)/.test(rowLine)) {
                  break;
                }
                var rowCells = splitPipeCells(rowLine);
                if (rowCells.length > colCount) {
                  var fixed;
                  if (colCount >= 4) {
                    var tailCount = colCount - 3;
                    var titleEnd = rowCells.length - tailCount;
                    var mergedTitle = rowCells.slice(2, titleEnd).join(' \\| ');
                    fixed = [rowCells[0], rowCells[1], mergedTitle].concat(rowCells.slice(titleEnd));
                  } else {
                    fixed = rowCells.slice(0, colCount - 1).concat([rowCells.slice(colCount - 1).join(' \\| ')]);
                  }
                  out.push('| ' + fixed.join(' | ') + ' |');
                } else {
                  out.push(rowLine);
                }
                i++;
              }
              continue;
            }
          }

          out.push(line);
          i++;
        }

        return out.join('\n');
      }

      function formatInlineText(text, allowLinks) {
        var tokens = [];
        function stash(html) {
          var id = '\u0007JKTOK' + tokens.length + '\u0007';
          tokens.push(html);
          return id;
        }

        var s = String(text || '');

        s = s.replace(/\\([\\`*_{}[\]()#+\-.!|])/g, function (_, ch) {
          return stash(escapeHtml(ch));
        });

        s = s.replace(/(`+)([\s\S]*?)\1/g, function (_, _ticks, code) {
          return stash('<code>' + escapeHtml(code.trim()) + '</code>');
        });

        if (allowLinks) {
          var linked = '';
          var pos = 0;
          while (pos < s.length) {
            var openIdx = s.indexOf('[', pos);
            if (openIdx === -1) {
              linked += s.slice(pos);
              break;
            }
            var closeBracket = -1;
            var depthB = 0;
            for (var bi = openIdx; bi < s.length; bi++) {
              if (s.charAt(bi) === '[') depthB++;
              else if (s.charAt(bi) === ']') {
                depthB--;
                if (depthB === 0) {
                  closeBracket = bi;
                  break;
                }
              }
            }
            if (closeBracket === -1 || s.charAt(closeBracket + 1) !== '(') {
              linked += s.slice(pos, openIdx + 1);
              pos = openIdx + 1;
              continue;
            }
            var urlStart = closeBracket + 2;
            var closeParen = -1;
            var depthP = 1;
            for (var pi = urlStart; pi < s.length; pi++) {
              var pc = s.charAt(pi);
              if (pc === '(') depthP++;
              else if (pc === ')') {
                depthP--;
                if (depthP === 0) {
                  closeParen = pi;
                  break;
                }
              }
            }
            if (closeParen === -1) {
              linked += s.slice(pos, openIdx + 1);
              pos = openIdx + 1;
              continue;
            }
            var labelRaw = s.slice(openIdx + 1, closeBracket);
            var hrefRaw = s.slice(urlStart, closeParen).trim();
            var titleMatch = hrefRaw.match(/^([^\s]+)\s+"([^"]*)"$/);
            var cleanHref = titleMatch ? titleMatch[1] : hrefRaw;
            var linkTitle = titleMatch ? ' title="' + escapeHtml(titleMatch[2]) + '"' : '';
            linked += s.slice(pos, openIdx) + stash(
              '<a href="' + escapeHtml(cleanHref) + '"' + linkTitle + '>' + formatInlineText(labelRaw, false) + '</a>'
            );
            pos = closeParen + 1;
          }
          s = linked;
        }

        s = escapeHtml(s);
        s = s.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/(^|[^\w])__([^\n]+?)__(?=[^\w]|$)/g, '$1<strong>$2</strong>');
        s = s.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
        s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
        s = s.replace(/(^|[^\w])_([^_\n]+?)_(?=[^\w]|$)/g, '$1<em>$2</em>');

        var guard = 0;
        while (s.indexOf('\u0007JKTOK') !== -1 && guard < 10) {
          s = s.replace(/\u0007JKTOK(\d+)\u0007/g, function (_, idx) {
            return tokens[Number(idx)] || '';
          });
          guard++;
        }
        return s;
      }

      function fallbackMarkdownToHtml(rawMd) {
        var md = normalizeMarkdownInput(rawMd);
        if (!md.trim()) return '';

        var lines = md.split('\n');
        var html = [];
        var i = 0;

        function isBlockBoundary(idx) {
          if (idx >= lines.length) return true;
          var ln = lines[idx];
          if (!ln.trim()) return true;
          if (/^\s*(```+|~~~+)/.test(ln)) return true;
          if (/^\s*#{1,6}\s+/.test(ln)) return true;
          if (/^\s*(?:-\s*){3,}$|^\s*(?:\*\s*){3,}$|^\s*(?:_\s*){3,}$/.test(ln)) return true;
          if (/^\s*>\s?/.test(ln)) return true;
          if (/^\s*(?:[-*+]|\d+[.)])\s+/.test(ln)) return true;
          if (idx + 1 < lines.length && ln.indexOf('|') !== -1 && isTableSeparatorLine(lines[idx + 1])) return true;
          return false;
        }

        while (i < lines.length) {
          var line = lines[i];

          if (!line.trim()) {
            i++;
            continue;
          }

          var fenceMatch = line.match(/^\s*(```+|~~~+)\s*([a-zA-Z0-9_-]*)/);
          if (fenceMatch) {
            var fChar = fenceMatch[1].charAt(0);
            var fLen = fenceMatch[1].length;
            var fLang = fenceMatch[2] || '';
            var codeLines = [];
            i++;
            while (i < lines.length) {
              var endMatch = lines[i].match(/^\s*(```+|~~~+)\s*$/);
              if (endMatch && endMatch[1].charAt(0) === fChar && endMatch[1].length >= fLen) {
                i++;
                break;
              }
              codeLines.push(lines[i]);
              i++;
            }
            var cls = fLang ? ' class="language-' + escapeHtml(fLang) + '"' : '';
            html.push('<pre><code' + cls + '>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
            continue;
          }

          var hMatch = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*$/);
          if (hMatch) {
            var level = hMatch[1].length;
            html.push('<h' + level + '>' + formatInlineText(hMatch[2], true) + '</h' + level + '>');
            i++;
            continue;
          }

          if (/^\s*(?:-\s*){3,}$|^\s*(?:\*\s*){3,}$|^\s*(?:_\s*){3,}$/.test(line)) {
            html.push('<hr>');
            i++;
            continue;
          }

          if (/^\s*>\s?/.test(line)) {
            var bqLines = [];
            while (i < lines.length && (/^\s*>\s?/.test(lines[i]) || (lines[i].trim() && !isBlockBoundary(i)))) {
              bqLines.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }

            .replace(/\s*\[[JYA]\d{2,}(?:\s*[,\-\u2013]\s*[JYA]?\d{2,})*\]/g, '')
            .replace(/\s+([.,;:!?])/g, '$1')
            .replace(/\s{2,}/g, ' ')
            .trim();
        }
        return cleaned;
      }

      function extractPlainSentences(source, opts) {
        var maxSentences = (opts && typeof opts.maxSentences === 'number') ? opts.maxSentences : 2;
        var maxChars = (opts && typeof opts.maxChars === 'number') ? opts.maxChars : 220;
        var text = extractPlainText(source, opts);
        if (!text) return { text: '', sentences: [], truncated: false };

        var protectedText = text.replace(ABBREV_PROTECT_RX, function (m) {
          return m.replace(/\./g, '\u0007DOT');
        });
        var rawSentences = protectedText.match(/[^.!?]+(?:[.!?]+|$)/g) || [protectedText];
        var sentences = [];
        for (var i = 0; i < rawSentences.length; i++) {
          var s = rawSentences[i].replace(/\u0007DOT/g, '.').trim();
          if (s) sentences.push(s);
        }

        var picked = sentences.slice(0, maxSentences);
        var joined = picked.join(' ').trim();
        var truncated = sentences.length > picked.length;

        if (joined.length > maxChars) {
          var slice = joined.slice(0, maxChars);
          var lastSpace = slice.lastIndexOf(' ');
          joined = (lastSpace > maxChars * 0.55 ? slice.slice(0, lastSpace) : slice).replace(/[.,;:!?\-\s]+$/, '') + '\u2026';
          truncated = true;
        }

        return { text: joined, sentences: picked, truncated: truncated };
      }

      applyShellLabels();
      initThemeController();
      initReadingProgressFallback();
      initDrawerAndPrint();

      var rawEl = document.getElementById('m');
      var target = document.getElementById('c');
      var rawMd = rawEl ? rawEl.value : '';
      var roleNameEl = document.getElementById('toolbar-role');
      var roleName = roleNameEl ? roleNameEl.textContent.trim() : '';

      var parsedResult = parseMarkdown(rawMd);
      var sanitizedFrag = sanitizeHtmlToFragment(parsedResult.html);
      var normalizedResult = normalizeSections(sanitizedFrag, { roleName: roleName, lang: lang });

      updateVitals(normalizedResult.stats);

      if (target) {
        var mountNodes = [];
        for (var pi = 0; pi < normalizedResult.preambleNodes.length; pi++) {
          mountNodes.push(normalizedResult.preambleNodes[pi]);
        }
        for (var si = 0; si < normalizedResult.sections.length; si++) {
          var sec = normalizedResult.sections[si];
          var secEl = document.createElement('section');
          secEl.id = sec.id;
          secEl.className = 'dossier-section';
          secEl.setAttribute('data-section-type', sec.sectionType);
          secEl.setAttribute('data-section-index', String(sec.index));
          secEl.appendChild(sec.headingEl);
          for (var ni = 0; ni < sec.nodes.length; ni++) {
            secEl.appendChild(sec.nodes[ni]);
          }
          mountNodes.push(secEl);
        }
        target.replaceChildren.apply(target, mountNodes);
        wrapTables(target);
        populateBasicToc(target);
      }

      var parserApi = {
        engine: parsedResult.engine,
        normalizeMarkdownInput: normalizeMarkdownInput,
        fallbackMarkdownToHtml: fallbackMarkdownToHtml,
        parseMarkdown: parseMarkdown,
        sanitizeHtmlToFragment: sanitizeHtmlToFragment,
        isSafeHref: isSafeHref,
        classifySection: classifySection,
        getSectionIconSvg: getSectionIconSvg,
        normalizeSections: normalizeSections,
        extractTableData: extractTableData,
        extractPlainText: extractPlainText,
        extractPlainSentences: extractPlainSentences,
        getSections: function () { return normalizedResult.sections; },
        getStats: function () { return normalizedResult.stats; }
      };

      window.JourKaParser = parserApi;
      window.JourKaShell = {
        lang: lang,
        getTheme: getTheme,
        setTheme: setTheme,
        updateVitals: updateVitals,
        wrapTables: wrapTables,
        populateBasicToc: populateBasicToc,
        closeTocDrawer: closeTocDrawer,
        parser: parserApi,
        sections: normalizedResult.sections
      };
    })();
  </script>
</body>
