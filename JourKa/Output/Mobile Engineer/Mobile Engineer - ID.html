      function trimPillText(text, maxLen) {
        var limit = maxLen || 40;
        var clean = String(text || '')
          .replace(/\s*\[[JYA]\d{2,}(?:\s*[,\-\u2013]\s*[JYA]?\d{2,})*\]/g, '')
          .replace(/\s+/g, ' ')
          .replace(/[:\-\u2013\s]+$/, '')
          .trim();
        if (clean.length <= limit) return clean;
        var slice = clean.slice(0, limit);
        var lastSpace = slice.lastIndexOf(' ');
        return (lastSpace > limit * 0.55 ? slice.slice(0, lastSpace) : slice).replace(/[.,;:!?\-\s]+$/, '') + '\u2026';
      }

      function extractListItemDirectSummary(liEl) {
        if (!liEl) return '';
        var parts = [];
        for (var i = 0; i < liEl.childNodes.length; i++) {
          var ch = liEl.childNodes[i];
          if (ch.nodeType === 1 && (ch.tagName === 'UL' || ch.tagName === 'OL' || ch.tagName === 'PRE' || ch.tagName === 'TABLE')) {
            continue;
          }
          var txt = (ch.textContent || '').replace(/\s+/g, ' ').trim();
          if (txt) parts.push(txt);
        }
        var own = parts.join(' ').trim();
        var subList = liEl.querySelector(':scope > ul, :scope > ol');
        if (subList) {
          var firstSub = subList.querySelector(':scope > li');
          if (firstSub) {
            var subTxt = extractListItemDirectSummary(firstSub);
            if (subTxt) {
              if (own && !/[.!?]$/.test(own)) own += ':';
              return (own ? (own + ' ' + subTxt) : subTxt).trim();
            }
          }
        }
        return own;
      }

      function extractSectionTldr(sec, allSections, langCode) {
        var lc = langCode === 'id' ? 'id' : 'en';
        var at = ACCORDION_I18N[lc];
        var bt = BENTO_I18N[lc];
        var nodes = (sec && Array.isArray(sec.nodes)) ? sec.nodes : [];

        var pCandidates = [];
        var liCandidates = [];
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          if (n.nodeType !== 1) continue;
          var tag = n.tagName;
          if (tag === 'P' || tag === 'BLOCKQUOTE') {
            var pTxt = (n.textContent || '').replace(/\s+/g, ' ').trim();
            if (pTxt) pCandidates.push(pTxt);
          } else if (tag === 'UL' || tag === 'OL') {
            var topLis = n.querySelectorAll(':scope > li');
            for (var li = 0; li < topLis.length; li++) {
              var lTxt = extractListItemDirectSummary(topLis[li]);
              if (lTxt) {
                if (!/[.!?]$/.test(lTxt)) lTxt += '.';
                liCandidates.push(lTxt);
              }
            }
          }
        }

        var chosenSource = '';
        if (pCandidates.length > 0) {
          var isDisclaimer = /^\s*(?:note|disclaimer|catatan|penafian)\b/i.test(pCandidates[0]);
          if (isDisclaimer && pCandidates.length > 1) {
            chosenSource = pCandidates.slice(1).join(' ');
          } else {
            chosenSource = pCandidates.join(' ');
          }
        } else if (liCandidates.length > 0) {
          chosenSource = liCandidates.join(' ');
        }

        if (chosenSource) {
          var sentRes = extractPlainSentences(chosenSource, {
            maxSentences: 2,
            maxChars: 215,
            stripCitations: true
          });
          if (sentRes.text) return sentRes.text;
        }

        if (sec && sec.sectionType === 'evidence') {
          var ev = extractEvidenceCounts(sec, allSections, lc);
          if (ev.total > 0) {
            var evParts = [];
            if (ev.jobs > 0) evParts.push(bt.pillJobs(ev.jobs));
            if (ev.youtube > 0) evParts.push(bt.pillYoutube(ev.youtube));
            if (ev.abroad > 0) evParts.push(bt.pillAbroad(ev.abroad));
            var partStr = evParts.length ? evParts.join(', ') : String(ev.total);
            return at.evidenceTldr(ev.total, partStr);
          }
        }

        var tbl = extractTableData(sec);
        if (tbl && tbl.rowCount > 0) {
          var colList = tbl.headers.slice(0, 3).join(', ');
          return at.tableTldr(tbl.rowCount, colList || sec.cleanTitle);
        }

        if (sec && sec.stats && sec.stats.codeBlockCount > 0) {
          return at.diagramTldr(sec.stats.codeBlockCount);
        }

        return at.genericTldr((sec && sec.cleanTitle) || '');
      }

      function extractSectionTopicPills(sec, allSections, langCode) {
        var lc = langCode === 'id' ? 'id' : 'en';
        var bt = BENTO_I18N[lc];
        var nodes = (sec && Array.isArray(sec.nodes)) ? sec.nodes : [];
        var seen = Object.create(null);
        var pills = [];

        function pushPill(rawLabel) {
          if (pills.length >= 4) return;
          var label = trimPillText(rawLabel, 40);
          if (!label || /^\[[JYA]\d{2,}\]$/i.test(label)) return;
          var key = label.toLowerCase();
          if (seen[key]) return;
          seen[key] = true;
          pills.push(label);
        }

        for (var i = 0; i < nodes.length && pills.length < 4; i++) {
          var n = nodes[i];
          if (n.nodeType !== 1) continue;
          if (n.tagName === 'H3') {
            pushPill(n.textContent);
          } else {
            var nestedH3s = n.querySelectorAll('h3');
            for (var hi = 0; hi < nestedH3s.length && pills.length < 4; hi++) {
              pushPill(nestedH3s[hi].textContent);
            }
          }
        }

        if (pills.length < 3) {
          for (var j = 0; j < nodes.length && pills.length < 4; j++) {
            var ln = nodes[j];
            if (ln.nodeType !== 1 || (ln.tagName !== 'UL' && ln.tagName !== 'OL')) continue;
            var topLis = ln.querySelectorAll(':scope > li');
            for (var li = 0; li < topLis.length && pills.length < 4; li++) {
              var lead = topLis[li].querySelector(':scope > strong, :scope > b, :scope > p > strong, :scope > p > b');
              if (lead) pushPill(lead.textContent);
            }
          }
        }

        if (pills.length < 3) {
          if (sec && sec.sectionType === 'evidence') {
            var ev = extractEvidenceCounts(sec, allSections, lc);
            if (ev.jobs > 0) pushPill(bt.pillJobs(ev.jobs));
            if (ev.youtube > 0) pushPill(bt.pillYoutube(ev.youtube));
            if (ev.abroad > 0) pushPill(bt.pillAbroad(ev.abroad));
          } else {
            var tbl = extractTableData(sec);
            if (tbl && tbl.rowCount > 0) {
              var useCol1 = sec && sec.sectionType === 'routine' && tbl.colCount >= 2 &&
                /\d{1,2}[:.]\d{2}/.test((tbl.rows[0] && tbl.rows[0].cells[0]) || '');
              var targetCol = useCol1 ? 1 : 0;
              for (var ri = 0; ri < tbl.rows.length && pills.length < 4; ri++) {
                var cellVal = tbl.rows[ri].cells[targetCol] || '';
                if (cellVal) {
                  var shortCell = cellVal.split(':')[0];
                  pushPill(shortCell);
                }
              }
            }
          }
        }

        if (pills.length === 0) {
          for (var k = 0; k < nodes.length && pills.length < 4; k++) {
            var hn = nodes[k];
            if (hn.nodeType !== 1) continue;
            if (hn.tagName === 'H4') {
              pushPill(hn.textContent);
            } else {
              var nestedH4s = hn.querySelectorAll('h4');
              for (var h4i = 0; h4i < nestedH4s.length && pills.length < 4; h4i++) {
                pushPill(nestedH4s[h4i].textContent);
              }
            }
          }
        }

        return pills;
      }

      function setCollapsibleState(container, wrap, inner, toggleBtn, expanded, opts) {
        if (!container || !wrap || !inner) return false;
        var next = !!expanded;
        var was = container.getAttribute('data-expanded') === 'true';
        var animate = !opts || opts.animate !== false;
        var reduced = isReducedMotion();

        if (next) {
          inner.removeAttribute('hidden');
          if (!was && animate && !reduced) {
            void wrap.offsetHeight;
          }
          container.setAttribute('data-expanded', 'true');
          if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
        } else {
          container.setAttribute('data-expanded', 'false');
          if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
          var transitions = (animate && !reduced && typeof wrap.getAnimations === 'function')
            ? wrap.getAnimations().filter(function (a) { return typeof CSSTransition !== 'undefined' ? (a instanceof CSSTransition) : true; })
            : [];
          if (transitions.length > 0) {
            Promise.all(transitions.map(function (tr) {
              return tr.finished.catch(function () { });
            })).then(function () {
              if (container.getAttribute('data-expanded') === 'false') {
                inner.setAttribute('hidden', 'until-found');
              }
            });
          } else {
            inner.setAttribute('hidden', 'until-found');
          }
        }
        return true;

      function getLeadElement(liEl) {

          var ch = children[i];

        }
        return null;
      }

      function getDirectSubList(liEl) {
        if (!liEl || liEl.nodeType !== 1) return null;

      function cloneLiWithoutSubList(liEl) {

        if (wrapper.children.length === 1 && wrapper.firstElementChild.tagName === 'P' && wrapper.childNodes.length === 1) {
          var p = wrapper.firstElementChild;
          var inner = document.createElement('div');
          while (p.firstChild) inner.appendChild(p.firstChild);

      function stripBlueprintPrefix(rawTitle) {
        var clean = String(rawTitle || '').replace(/\s*\[[JYA]\d{2,}(?:\s*[,\-\u2013]\s*[JYA]?\d{2,})*\]/g, '').trim();
        var stripped = clean.replace(/^(?:(?:Concrete\s+)?(?:Portfolio\s+)?(?:Project\s+Blueprint|Blueprint\s+Proyek|Cetak\s+Biru\s+Proyek|Project|Proyek|Blueprint|Cetak\s+Biru)\s*(?:\d+|[A-C])\s*[:.\-\u2013\u2014]\s*)/i, '');
        return stripped.trim() || clean;
      }

      function splitTopLevelCommas(str) {
        var parts = [];
        var buf = '';
        var depth = 0;
        for (var i = 0; i < str.length; i++) {
          var ch = str.charAt(i);
          if (ch === '(') depth++;
          else if (ch === ')' && depth > 0) depth--;
          if (ch === ',' && depth === 0) {
            if (buf.trim()) parts.push(buf.trim());
            buf = '';
          } else {
            buf += ch;
          }
        }
        if (buf.trim()) parts.push(buf.trim());
        return parts;
      }

      function extractTechStackPills(rawText) {
        var text = String(rawText || '')
          .replace(/^(?:Tech\s*Stack|Tools?\s*(?:&|and|dan)?\s*Stacks?(?:\s+Used|\s+yang\s+Digunakan)?|Alat\s*(?:&|dan)?\s*Stack(?:\s+yang\s+Digunakan)?)\s*:\s*/i, '')
          .replace(/\s*\[[JYA]\d{2,}(?:\s*[,\-\u2013]\s*[JYA]?\d{2,})*\]/g, '')
          .replace(/\.$/, '')
          .trim();
        if (!text) return { pills: [], extraCount: 0 };

        var rawItems = splitTopLevelCommas(text);
        var seen = Object.create(null);
        var cleanedAll = [];
        for (var i = 0; i < rawItems.length; i++) {
          var item = rawItems[i]
            .replace(/^\s*(?:and|dan|serta)\s+/i, '')
            .replace(/\s*\((?:for|untuk|e\.g\.|misalnya|seperti)[^)]*\)/gi, '')
            .replace(/\s+(?:for|untuk)\s+(?:background|unduhan|testing|pengujian|graphing|logging)\b[^,]*/gi, '')
            .replace(/\s+/g, ' ')
            .replace(/[.,;:\s]+$/, '')
            .trim();
          if (!item) continue;
          if (item.length > 34) {
            var parenIdx = item.indexOf('(');
            if (parenIdx > 4) item = item.slice(0, parenIdx).trim();
          }
          if (item.length > 36) {
            var slice = item.slice(0, 34);
            var sp = slice.lastIndexOf(' ');
            item = (sp > 16 ? slice.slice(0, sp) : slice) + '\u2026';
          }
          var key = item.toLowerCase();
          var isSubsetDup = false;
          if (seen[key]) {
            isSubsetDup = true;
          } else {
            for (var existingKey in seen) {
              if (Object.prototype.hasOwnProperty.call(seen, existingKey) && existingKey.indexOf(key + ' ') === 0) {
                isSubsetDup = true;
                break;
              }
            }
          }
          if (!isSubsetDup) {
            seen[key] = true;
            cleanedAll.push(item);
          }
        }
        return {
          pills: cleanedAll.slice(0, 4),
          extraCount: Math.max(0, cleanedAll.length - 4)
        };
      }

      function classifyBlueprintField(leadText) {
        var s = String(leadText || '').toLowerCase();
        if (/problem\s*statement|pernyataan\s*masalah/.test(s)) return 'problem';
        if (/tech\s*stack|tools?|alat/.test(s)) return 'stack';
        if (/evaluat|kriteria\s*evaluasi|hiring\s*manager/.test(s)) return 'criteria';
        if (/workflow|architecture|arsitektur|alur\s*kerja/.test(s)) return 'architecture';
        return 'other';
      }

      function parseProjectFieldsFromList(listEl) {
        var fields = [];
        var problemPreview = '';
        var stackPills = [];
        var stackExtra = 0;
        var lis = listEl ? listEl.querySelectorAll(':scope > li') : [];
        for (var i = 0; i < lis.length; i++) {
          var li = lis[i];
          var lead = getLeadElement(li);
          var leadTxt = lead ? (lead.textContent || '').trim() : '';
          var kind = classifyBlueprintField(leadTxt);
          var fullText = (li.textContent || '').replace(/\s+/g, ' ').trim();
          if (kind === 'problem' && !problemPreview) {
            problemPreview = fullText
              .replace(/^[^:]+:\s*/, '')
              .replace(/\s*\[[JYA]\d{2,}(?:\s*[,\-\u2013]\s*[JYA]?\d{2,})*\]/g, '')
              .trim();
          } else if (kind === 'stack' && stackPills.length === 0) {
            var stackRes = extractTechStackPills(fullText);
            stackPills = stackRes.pills;
            stackExtra = stackRes.extraCount;
          }
          fields.push({ kind: kind, node: cloneLiWithoutSubList(li) });
        }
        return {
          problemPreview: problemPreview,
          stackPills: stackPills,
          stackExtra: stackExtra,
          fields: fields
        };
      }

      function enhancePortfolioBlueprints(sec, langCode) {
        if (!sec || !sec.bodyEl) return 0;
        var root = sec.bodyEl;
        var children = Array.prototype.slice.call(root.children);
        var portH3Idx = -1;
        for (var i = 0; i < children.length; i++) {
          var h3Txt = (children[i].textContent || '').trim();
          if (children[i].tagName === 'H3' &&
            !/^(?:phase|fase|tahap)\s*\d+/i.test(h3Txt) &&
            /portfolio|portofolio|blueprint|cetak\s+biru/i.test(h3Txt)) {
            portH3Idx = i;
            break;
          }
        }
        if (portH3Idx === -1) return 0;

        var sliceEnd = children.length;
        for (var j = portH3Idx + 1; j < children.length; j++) {
          if (children[j].tagName === 'H3') {
            sliceEnd = j;
            break;
          }
        }

        var projects = [];
        var consumed = [];
        var insertAnchor = children[portH3Idx];

        // Pattern A: <h4> project headings followed by <ul>/<ol>
        var hasH4 = false;
        for (var k = portH3Idx + 1; k < sliceEnd; k++) {
          if (children[k].tagName === 'H4') {
            hasH4 = true;
            break;
          }
        }

        if (hasH4) {
          var curProj = null;
          for (var a = portH3Idx + 1; a < sliceEnd; a++) {
            var elA = children[a];
            if (elA.tagName === 'H4') {
              curProj = {
                cleanTitle: stripBlueprintPrefix(elA.textContent || ''),
                problemPreview: '',
                stackPills: [],
                stackExtra: 0,
                fields: []
              };
              projects.push(curProj);
              consumed.push(elA);
            } else if (curProj && (elA.tagName === 'UL' || elA.tagName === 'OL')) {
              var parsedA = parseProjectFieldsFromList(elA);
              curProj.problemPreview = parsedA.problemPreview;
              curProj.stackPills = parsedA.stackPills;
              curProj.stackExtra = parsedA.stackExtra;
              curProj.fields = parsedA.fields;
              consumed.push(elA);
            } else if (!curProj && elA.tagName === 'P') {
              insertAnchor = elA;
            }
          }
        } else {
          // Pattern B: <ul> or <ol> containing project <li> items with nested sub-lists
          for (var b = portH3Idx + 1; b < sliceEnd; b++) {
            var elB = children[b];
            if (elB.tagName === 'P' && projects.length === 0) {
              insertAnchor = elB;
              continue;
            }
            if (elB.tagName === 'UL' || elB.tagName === 'OL') {
              var topLis = elB.querySelectorAll(':scope > li');
              var structuredLis = [];
              for (var liIdx = 0; liIdx < topLis.length; liIdx++) {
                var subL = getDirectSubList(topLis[liIdx]);
                if (subL) structuredLis.push({ li: topLis[liIdx], sub: subL });
              }
              if (structuredLis.length >= 2) {
                consumed.push(elB);
                for (var sIdx = 0; sIdx < structuredLis.length; sIdx++) {
                  var item = structuredLis[sIdx];
                  var lead = getLeadElement(item.li);
                  var rawT = lead ? (lead.textContent || '') : (item.li.textContent || '').split('\n')[0];
                  var parsedB = parseProjectFieldsFromList(item.sub);
                  projects.push({
                    cleanTitle: stripBlueprintPrefix(rawT),
                    problemPreview: parsedB.problemPreview,
                    stackPills: parsedB.stackPills,
                    stackExtra: parsedB.stackExtra,
                    fields: parsedB.fields
                  });
                }
              }
            }
          }
        }

        if (projects.length === 0) return 0;

        var grid = document.createElement('div');
        grid.className = 'blueprint-grid';
        for (var pIdx = 0; pIdx < projects.length; pIdx++) {
          grid.appendChild(buildBlueprintCard(projects[pIdx], pIdx, langCode));
        }

        if (insertAnchor && insertAnchor.parentNode === root) {
          root.insertBefore(grid, insertAnchor.nextSibling);
        } else {
          root.appendChild(grid);
        }
        for (var ci = 0; ci < consumed.length; ci++) {
          if (consumed[ci].parentNode === root) root.removeChild(consumed[ci]);
        }
        return projects.length;
      }

      function readCheckState(key) {
        try {
          var raw = window.localStorage.getItem(key);
          if (!raw) return {};
          var parsed = JSON.parse(raw);
          return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      function writeCheckState(key, map) {
        try {
          var hasAny = false;
          for (var k in map) {
            if (Object.prototype.hasOwnProperty.call(map, k) && map[k]) {
              hasAny = true;
              break;
            }
          }
          if (!hasAny) window.localStorage.removeItem(key);
          else window.localStorage.setItem(key, JSON.stringify(map));
        } catch (e) { }
      }

      function extractOnboardingPhaseItems(listEl) {
        var focusNode = null;
        var actionNodes = [];
        var topLis = listEl ? listEl.querySelectorAll(':scope > li') : [];
        for (var i = 0; i < topLis.length; i++) {
          var li = topLis[i];
          var lead = getLeadElement(li);
          var leadTxt = lead ? (lead.textContent || '').trim() : '';
          var sub = getDirectSubList(li);
          if (!sub && /^(?:Operational\s+Focus|Fokus\s+Operasional)\s*:?$/i.test(leadTxt)) {
            focusNode = cloneLiWithoutSubList(li);
          } else if (sub && /^(?:Action\s+Items?|Butir\s+Tindakan)\s*:?$/i.test(leadTxt)) {
            var subLis = sub.querySelectorAll(':scope > li');
            for (var si = 0; si < subLis.length; si++) {
              actionNodes.push(cloneLiWithoutSubList(subLis[si]));
            }
          } else if (sub) {
            var nestedLis = sub.querySelectorAll(':scope > li');
            for (var ni = 0; ni < nestedLis.length; ni++) {
              actionNodes.push(cloneLiWithoutSubList(nestedLis[ni]));
            }
          } else {
            actionNodes.push(cloneLiWithoutSubList(li));
          }
        }
        return { focusNode: focusNode, actionNodes: actionNodes };
      }

      function enhanceOnboardingPlaybook(sec, langCode) {
        if (!sec || !sec.bodyEl) return 0;
        var root = sec.bodyEl;
        var children = Array.prototype.slice.call(root.children);
        var phases = [];
        var consumed = [];
        var phaseRx = /(?:days?|hari)\s*(?:1\s*[-\u2013\u2014]\s*30|31\s*[-\u2013\u2014]\s*60|61\s*[-\u2013\u2014]\s*90)/i;

        // Pattern A: <h3> phase headings followed by <ul>/<ol>
        var h3Indices = [];
        for (var i = 0; i < children.length; i++) {
          if (children[i].tagName === 'H3' && phaseRx.test(children[i].textContent || '')) {
            h3Indices.push(i);
          }
        }

        if (h3Indices.length >= 2) {
          for (var hi = 0; hi < h3Indices.length; hi++) {
            var startIdx = h3Indices[hi];
            var endIdx = (hi + 1 < h3Indices.length) ? h3Indices[hi + 1] : children.length;
            var h3El = children[startIdx];
            consumed.push(h3El);
            var combinedFocus = null;
            var combinedActions = [];
            for (var ci = startIdx + 1; ci < endIdx; ci++) {
              var elC = children[ci];
              if (elC.tagName === 'UL' || elC.tagName === 'OL') {
                var extA = extractOnboardingPhaseItems(elC);
                if (extA.focusNode && !combinedFocus) combinedFocus = extA.focusNode;
                combinedActions = combinedActions.concat(extA.actionNodes);
                consumed.push(elC);
              }
            }
            phases.push({
              key: 'p' + (phases.length + 1),
              title: (h3El.textContent || '').trim(),
              focusNode: combinedFocus,
              actionNodes: combinedActions
            });
          }
        } else {
          // Pattern B: single <ul>/<ol> with bold phase <li> items + nested action <ul>
          for (var bi = 0; bi < children.length; bi++) {
            var elB = children[bi];
            if (elB.tagName !== 'UL' && elB.tagName !== 'OL') continue;
            var topLis = elB.querySelectorAll(':scope > li');
            var matchedB = [];
            for (var liIdx = 0; liIdx < topLis.length; liIdx++) {
              var liB = topLis[liIdx];
              var lead = getLeadElement(liB);
              var leadTxt = lead ? (lead.textContent || '').trim() : '';
              var subB = getDirectSubList(liB);
              if (phaseRx.test(leadTxt) && subB) {
                var subItems = [];
                var subLis = subB.querySelectorAll(':scope > li');
                for (var sli = 0; sli < subLis.length; sli++) {
                  subItems.push(cloneLiWithoutSubList(subLis[sli]));
                }
                matchedB.push({
                  key: 'p' + (matchedB.length + 1),
                  title: leadTxt,
                  focusNode: null,
                  actionNodes: subItems
                });
              }
            }
            if (matchedB.length >= 2) {
              phases = matchedB;
              consumed.push(elB);
              break;
            }
          }
        }

        if (phases.length < 2) return 0;

        var lc = langCode === 'id' ? 'id' : 'en';
        var t2 = TIER2_I18N[lc];
        var savedChecks = readCheckState(checkStorageKey);
        tier2State.checks = savedChecks;
        tier2State.checkIds = [];

        var playbook = document.createElement('div');
        playbook.className = 'onboarding-playbook';
        playbook.id = 'onboarding-playbook';
        playbook.setAttribute('data-active-phase', phases[0].key);

        var header = document.createElement('div');
        header.className = 'onboarding-header';

        var headerRow = document.createElement('div');
        headerRow.className = 'onboarding-header-row';

        var progressLabel = document.createElement('span');
        progressLabel.className = 'onboarding-progress-label';
        progressLabel.id = 'onboarding-progress-label';
        progressLabel.setAttribute('aria-live', 'polite');

        var resetBtn = document.createElement('button');
        resetBtn.type = 'button';
        resetBtn.className = 'onboarding-reset-btn';
        resetBtn.textContent = t2.resetChecks;
        resetBtn.hidden = true;

        headerRow.appendChild(progressLabel);
        headerRow.appendChild(resetBtn);

        var track = document.createElement('div');
        track.className = 'onboarding-progress-track';
        track.setAttribute('role', 'progressbar');
        track.setAttribute('aria-valuemin', '0');
        track.setAttribute('aria-labelledby', 'onboarding-progress-label');

        var fill = document.createElement('div');
        fill.className = 'onboarding-progress-fill';
        track.appendChild(fill);

        header.appendChild(headerRow);
        header.appendChild(track);
        playbook.appendChild(header);

        var tablist = document.createElement('div');
        tablist.className = 'onboarding-tabs';
        tablist.setAttribute('role', 'tablist');
        tablist.setAttribute('aria-label', t2.onboardingTabsLabel);

        var panelsWrap = document.createElement('div');
        panelsWrap.className = 'onboarding-panels';

        var tabSpecs = [];
        var panelMap = Object.create(null);
        var tabLabelList = [t2.phase1Tab, t2.phase2Tab, t2.phase3Tab];
        var allPanelIds = [];

        for (var pi = 0; pi < phases.length; pi++) {
          var ph = phases[pi];
          var panelId = 'onboarding-panel-' + ph.key;
          var tabId = 'onboarding-tab-' + ph.key;
          allPanelIds.push(panelId);

          var tabBtn = document.createElement('button');
          tabBtn.type = 'button';
          tabBtn.className = 'onboarding-tab';
          tabBtn.id = tabId;
          tabBtn.setAttribute('role', 'tab');
          tabBtn.setAttribute('data-phase', ph.key);
          tabBtn.setAttribute('aria-selected', pi === 0 ? 'true' : 'false');
          tabBtn.setAttribute('aria-controls', panelId);
          tabBtn.setAttribute('tabindex', pi === 0 ? '0' : '-1');

          var tabTxt = document.createElement('span');
          tabTxt.textContent = tabLabelList[pi] || ph.title;
          var tabCount = document.createElement('span');
          tabCount.className = 'onboarding-tab-count';
          tabBtn.appendChild(tabTxt);
          tabBtn.appendChild(tabCount);
          tablist.appendChild(tabBtn);

          var panel = document.createElement('div');
          panel.className = 'onboarding-panel';
          panel.id = panelId;
          panel.setAttribute('role', 'tabpanel');
          panel.setAttribute('aria-labelledby', tabId);
          panel.setAttribute('data-phase', ph.key);
          if (pi > 0) panel.setAttribute('hidden', 'until-found');

          var phTitle = document.createElement('h3');
          phTitle.className = 'onboarding-phase-title';
          phTitle.textContent = ph.title;
          panel.appendChild(phTitle);

          if (ph.focusNode) {
            var focusP = document.createElement('p');
            focusP.className = 'phase-focus';
            while (ph.focusNode.firstChild) focusP.appendChild(ph.focusNode.firstChild);
            panel.appendChild(focusP);
          }

          var checklist = document.createElement('div');
          checklist.className = 'onboarding-checklist';
          var phaseCheckIds = [];

          for (var ai = 0; ai < ph.actionNodes.length; ai++) {
            var checkId = ph.key + '-' + ai;
            phaseCheckIds.push(checkId);
            tier2State.checkIds.push(checkId);

            var lbl = document.createElement('label');
            lbl.className = 'check-item';
            lbl.setAttribute('data-check-id', checkId);

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'check-input';
            cb.setAttribute('data-check-id', checkId);
            if (savedChecks[checkId]) {
              cb.checked = true;
              lbl.classList.add('is-checked');
            }

            var span = document.createElement('span');
            span.className = 'check-text';
            var actNode = ph.actionNodes[ai];
            while (actNode.firstChild) span.appendChild(actNode.firstChild);

            lbl.appendChild(cb);
            lbl.appendChild(span);
            checklist.appendChild(lbl);
          }

          panel.appendChild(checklist);
          panelsWrap.appendChild(panel);

          panelMap[ph.key] = panel;
          tabSpecs.push({ key: ph.key, btn: tabBtn, countEl: tabCount, checkIds: phaseCheckIds });
        }

        var allTab = document.createElement('button');
        allTab.type = 'button';
        allTab.className = 'onboarding-tab';
        allTab.id = 'onboarding-tab-all';
        allTab.setAttribute('role', 'tab');
        allTab.setAttribute('data-phase', 'all');
        allTab.setAttribute('aria-selected', 'false');
        allTab.setAttribute('aria-controls', allPanelIds.join(' '));
        allTab.setAttribute('tabindex', '-1');
        var allTxt = document.createElement('span');
        allTxt.textContent = t2.allPhasesTab;
        allTab.appendChild(allTxt);
        tablist.appendChild(allTab);
        tabSpecs.push({ key: 'all', btn: allTab, countEl: null, checkIds: [] });

        playbook.appendChild(tablist);
        playbook.appendChild(panelsWrap);

        function refreshProgressUi() {
          var total = tier2State.checkIds.length;
          var done = 0;
          for (var k = 0; k < total; k++) {
            if (tier2State.checks[tier2State.checkIds[k]]) done++;
          }
          progressLabel.textContent = t2.progressLabel(done, total);
          track.setAttribute('aria-valuemax', String(total));
          track.setAttribute('aria-valuenow', String(done));
          fill.style.inlineSize = (total > 0 ? Math.round((done / total) * 100) : 0) + '%';
          resetBtn.hidden = (done === 0);

          for (var ti = 0; ti < tabSpecs.length; ti++) {
            var sp = tabSpecs[ti];
            if (!sp.countEl) continue;
            var pDone = 0;
            for (var ci = 0; ci < sp.checkIds.length; ci++) {
              if (tier2State.checks[sp.checkIds[ci]]) pDone++;
            }
            sp.countEl.textContent = pDone + '/' + sp.checkIds.length;
          }
        }

        function syncCheckboxesFromState() {
          var inputs = playbook.querySelectorAll('input.check-input[data-check-id]');
          for (var i = 0; i < inputs.length; i++) {
            var id = inputs[i].getAttribute('data-check-id');
            var checked = !!tier2State.checks[id];
            inputs[i].checked = checked;
            var row = inputs[i].closest('.check-item');
            if (row) row.classList.toggle('is-checked', checked);
          }
          refreshProgressUi();
        }

        function selectPhase(phaseKey, focusTab) {
          var valid = (phaseKey === 'all' || !!panelMap[phaseKey]);
          var targetKey = valid ? phaseKey : phases[0].key;
          playbook.setAttribute('data-active-phase', targetKey);

          for (var i = 0; i < tabSpecs.length; i++) {
            var sp = tabSpecs[i];
            var active = sp.key === targetKey;
            sp.btn.setAttribute('aria-selected', active ? 'true' : 'false');
            sp.btn.setAttribute('tabindex', active ? '0' : '-1');
            if (active && focusTab) sp.btn.focus();
          }

          for (var pk in panelMap) {
            if (!Object.prototype.hasOwnProperty.call(panelMap, pk)) continue;
            if (targetKey === 'all' || pk === targetKey) {
              panelMap[pk].removeAttribute('hidden');
            } else {
              panelMap[pk].setAttribute('hidden', 'until-found');
            }
          }
        }

        playbook.addEventListener('change', function (ev) {
          var inp = ev.target;
          if (!inp || !inp.classList || !inp.classList.contains('check-input')) return;
          var cid = inp.getAttribute('data-check-id');
          if (!cid) return;
          if (inp.checked) tier2State.checks[cid] = true;
          else delete tier2State.checks[cid];
          var row = inp.closest('.check-item');
          if (row) row.classList.toggle('is-checked', !!inp.checked);
          writeCheckState(checkStorageKey, tier2State.checks);
          refreshProgressUi();
        });

        tablist.addEventListener('click', function (ev) {
          var btn = ev.target && ev.target.closest ? ev.target.closest('.onboarding-tab') : null;
          if (!btn) return;
          selectPhase(btn.getAttribute('data-phase'), false);
        });

        tablist.addEventListener('keydown', function (ev) {
          var current = ev.target && ev.target.closest ? ev.target.closest('.onboarding-tab') : null;
          if (!current) return;
          var curIdx = -1;
          for (var i = 0; i < tabSpecs.length; i++) {
            if (tabSpecs[i].btn === current) { curIdx = i; break; }
          }
          if (curIdx === -1) return;
          var nextIdx = -1;
          if (ev.key === 'ArrowRight') nextIdx = (curIdx + 1) % tabSpecs.length;
          else if (ev.key === 'ArrowLeft') nextIdx = (curIdx - 1 + tabSpecs.length) % tabSpecs.length;
          else if (ev.key === 'Home') nextIdx = 0;
          else if (ev.key === 'End') nextIdx = tabSpecs.length - 1;
          if (nextIdx !== -1) {
            ev.preventDefault();
            selectPhase(tabSpecs[nextIdx].key, true);
          }
        });

        resetBtn.addEventListener('click', function () {
          tier2State.checks = {};
          writeCheckState(checkStorageKey, tier2State.checks);
          syncCheckboxesFromState();
        });

        window.addEventListener('storage', function (ev) {
          if (ev.key === checkStorageKey) {
            tier2State.checks = readCheckState(checkStorageKey);
            syncCheckboxesFromState();
          }
        });

        var firstConsumed = consumed[0];
        if (firstConsumed && firstConsumed.parentNode === root) {
          root.insertBefore(playbook, firstConsumed);
        } else {
          root.appendChild(playbook);
        }
        for (var rm = 0; rm < consumed.length; rm++) {
          if (consumed[rm].parentNode === root) root.removeChild(consumed[rm]);
        }

        refreshProgressUi();
        tier2State.playbook = {
          el: playbook,
          selectPhase: selectPhase,
          reset: function () {
            tier2State.checks = {};
            writeCheckState(checkStorageKey, tier2State.checks);
            syncCheckboxesFromState();
          },
          getProgress: function () {
            var total = tier2State.checkIds.length;
            var done = 0;
            for (var k = 0; k < total; k++) {
              if (tier2State.checks[tier2State.checkIds[k]]) done++;
            }
            return { done: done, total: total };
          }
        };
        return phases.length;
      }

      function enhanceSemanticCallouts(sections, langCode, bentoInfo) {
        var lc = langCode === 'id' ? 'id' : 'en';
        var t2 = TIER2_I18N[lc];
        var bt = BENTO_I18N[lc];
        var count = 0;

        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec || !sec.bodyEl) continue;
          var targetKind = null;
          var h3Rx = null;
          if (sec.sectionType === 'overview') {
            targetKind = 'verdict';
            h3Rx = /s1\s*\/\s*d4|education\s*(?:&|and)?\s*degree|pendidikan\s*(?:&|dan)?\s*gelar/i;
          } else if (sec.sectionType === 'guidance') {
            targetKind = 'ai';
            h3Rx = /ai\s+sentiment|sentimen\s+ai|future\s+outlook|prospek\s+masa\s+depan/i;
          }
          if (!targetKind || !h3Rx) continue;

          var children = Array.prototype.slice.call(sec.bodyEl.children);
          var startIdx = -1;
          for (var i = 0; i < children.length; i++) {
            if (children[i].tagName === 'H3' && h3Rx.test(children[i].textContent || '')) {
              startIdx = i;
              break;
            }
          }
          if (startIdx === -1) continue;

          var endIdx = children.length;
          for (var j = startIdx + 1; j < children.length; j++) {
            if (children[j].tagName === 'H3' || children[j].tagName === 'HR') {
              endIdx = j;
              break;
            }
          }

          var h3El = children[startIdx];
          var bodyNodes = children.slice(startIdx + 1, endIdx);
          if (bodyNodes.length === 0) continue;

          var aside = document.createElement('aside');
          aside.className = 'semantic-callout ' + (targetKind === 'verdict' ? 'semantic-callout--verdict' : 'semantic-callout--ai');
          aside.setAttribute('data-callout', targetKind === 'verdict' ? 'verdict' : 'ai-sentiment');

          var tier = 'neutral';
          var badgeText = t2.aiCalloutBadge;
          if (targetKind === 'verdict') {
            tier = (bentoInfo && bentoInfo.degree && bentoInfo.degree.tier) ? bentoInfo.degree.tier : 'neutral';
            aside.setAttribute('data-verdict-tier', tier);
            var labelMap = {
              required: bt.verdictRequired,
              preferred: bt.verdictPreferred,
              optional: bt.verdictOptional,
              neutral: bt.verdictNeutral
            };
            badgeText = labelMap[tier] || bt.verdictNeutral;
          }

          var hdr = document.createElement('div');
          hdr.className = 'callout-header';
          var hdrMain = document.createElement('div');
          hdrMain.className = 'callout-header-main';

          var icon = document.createElement('span');
          icon.className = 'callout-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.appendChild(createSvgIcon(targetKind === 'verdict' ? TIER2_ICONS.verdictCap : TIER2_ICONS.aiSparkles));

          h3El.className = 'callout-title';
          hdrMain.appendChild(icon);
          hdrMain.appendChild(h3El.cloneNode(true));

          var badge = document.createElement('span');
          badge.className = 'callout-badge';
          badge.textContent = badgeText;

          hdr.appendChild(hdrMain);
          hdr.appendChild(badge);
          aside.appendChild(hdr);

          var body = document.createElement('div');
          body.className = 'callout-body';
          for (var bi = 0; bi < bodyNodes.length; bi++) {
            body.appendChild(bodyNodes[bi]);
          }
          aside.appendChild(body);

          sec.bodyEl.replaceChild(aside, h3El);
          tier2State.callouts.push(aside);
          count++;
        }
        return count;
      }

      var DEEPDIVE_SECTIONS = { overview: 1, skills: 1, routine: 1, guidance: 1, abroad: 1, generic: 1 };

      function applyDeepDiveToContainer(container, langCode) {
        if (!container) return 0;
        var lc = langCode === 'id' ? 'id' : 'en';
        var t2 = TIER2_I18N[lc];
        var created = 0;
        var children = Array.prototype.slice.call(container.children);
        var entries = [];
        var curRun = [];

        function flushRun() {
          if (curRun.length >= 2) {
            var totalChars = 0;
            for (var r = 0; r < curRun.length; r++) {
              totalChars += (curRun[r].textContent || '').trim().length;
            }
            if (curRun.length >= 3 || totalChars > 1100) {
              entries.push({ kind: 'run', paras: curRun.slice() });
            }
          }
          curRun = [];
        }

        for (var i = 0; i < children.length; i++) {
          var ch = children[i];
          if (ch.tagName === 'P') {
            curRun.push(ch);
          } else {
            flushRun();
            if (ch.classList && ch.classList.contains('semantic-callout')) {
              var cb = ch.querySelector('.callout-body');
              if (cb) entries.push({ kind: 'callout', body: cb });
            }
          }
        }
        flushRun();

        for (var ei = 0; ei < entries.length; ei++) {
          if (entries[ei].kind === 'callout') {
            created += applyDeepDiveToContainer(entries[ei].body, langCode);
            continue;
          }
          var pList = entries[ei].paras;
          var leadP = pList[0];
          var restParas = pList.slice(1);
          var ddIdx = tier2State.deepdives.length + 1;
          var ddId = 'deepdive-' + ddIdx;
          var restId = 'deepdive-rest-' + ddIdx;

          var block = document.createElement('div');
          block.className = 'deepdive-block';
          block.id = ddId;
          block.setAttribute('data-expanded', 'false');

          leadP.parentNode.insertBefore(block, leadP);
          leadP.classList.add('deepdive-lead');
          block.appendChild(leadP);

          var restWrap = document.createElement('div');
          restWrap.className = 'deepdive-rest-wrap';
          restWrap.id = restId;

          var restInner = document.createElement('div');
          restInner.className = 'deepdive-rest-inner';
          restInner.setAttribute('hidden', 'until-found');

          var restBody = document.createElement('div');
          restBody.className = 'deepdive-rest';
          for (var pi = 0; pi < restParas.length; pi++) {
            restBody.appendChild(restParas[pi]);
          }

          restInner.appendChild(restBody);
          restWrap.appendChild(restInner);
          block.appendChild(restWrap);

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'deepdive-toggle';
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-controls', restId);
          var moreLabel = t2.deepdiveMore(restParas.length);
          btn.textContent = moreLabel;
          block.appendChild(btn);

          (function (blk, rWrap, rInner, tBtn, mLabel, lLabel) {
            tBtn.addEventListener('click', function () {
              var isOpen = blk.getAttribute('data-expanded') === 'true';
              var nextOpen = !isOpen;
              setCollapsibleState(blk, rWrap, rInner, tBtn, nextOpen, { animate: true });
              tBtn.textContent = nextOpen ? lLabel : mLabel;
            });
            tier2State.deepdives.push({
              id: ddId,
              block: blk,
              wrap: rWrap,
              inner: rInner,
              toggleBtn: tBtn,
              moreLabel: mLabel,
              lessLabel: lLabel
            });
          })(block, restWrap, restInner, btn, moreLabel, t2.deepdiveLess);

          created++;
        }
        return created;
      }

      function enhanceMentorDeepDives(sections, langCode) {
        var total = 0;
        for (var i = 0; i < sections.length; i++) {
          var sec = sections[i];
          if (!sec || !sec.bodyEl || !DEEPDIVE_SECTIONS[sec.sectionType]) continue;
          total += applyDeepDiveToContainer(sec.bodyEl, langCode);
        }
        return total;
      }

      function setBlueprintExpanded(idOrIndex, expanded, opts) {
        for (var i = 0; i < tier2State.blueprints.length; i++) {
          var bp = tier2State.blueprints[i];
          if (bp.id === idOrIndex || String(i + 1) === String(idOrIndex)) {
            return setCollapsibleState(bp.card, bp.wrap, bp.inner, bp.toggleBtn, expanded, opts);
          }
        }
        return false;
      }

      function toggleBlueprint(idOrIndex, opts) {
        for (var i = 0; i < tier2State.blueprints.length; i++) {
          var bp = tier2State.blueprints[i];
          if (bp.id === idOrIndex || String(i + 1) === String(idOrIndex)) {
            var isOpen = bp.card.getAttribute('data-expanded') === 'true';
            return setCollapsibleState(bp.card, bp.wrap, bp.inner, bp.toggleBtn, !isOpen, opts);
          }
        }
        return false;
      }

      function setDeepDiveExpanded(id, expanded, opts) {
        for (var i = 0; i < tier2State.deepdives.length; i++) {

      function splitStepTitleAndMeta(rawLabel, trailingMeta) {
        var title = String(rawLabel || '').trim();
        var meta = String(trailingMeta || '').trim();
        if (!meta) {
          var endParen = title.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
          if (endParen && endParen[1].trim().length >= 3) {
            title = endParen[1].trim();
            meta = endParen[2].trim();
          }
        }
        return { title: title, meta: meta, details: [] };
      }

      function parseHorizontalSubLine(subLine) {
        var text = String(subLine || '');
        var items = [];
        var parenRx = /\(([^()]+)\)/g;
        var pm;
        var parenItems = [];
        while ((pm = parenRx.exec(text)) !== null) {
          var inner = pm[1].replace(/\s+/g, ' ').trim();
          if (inner) parenItems.push({ col: pm.index, text: inner });
        }
        if (parenItems.length >= 2) return parenItems;

        var bulletRx = /(?:^|\s)([\u2022\u25CF\u25AA]|-(?=\s))\s*/g;
        var starts = [];
        var bm;
        while ((bm = bulletRx.exec(text)) !== null) {
          starts.push({ col: bm.index + (bm[0].charAt(0) === ' ' ? 1 : 0), textStart: bm.index + bm[0].length });
        }
        if (starts.length >= 2) {
          for (var i = 0; i < starts.length; i++) {
            var end = (i + 1 < starts.length) ? starts[i + 1].col : text.length;
            var seg = text.slice(starts[i].textStart, end).replace(/\s+/g, ' ').trim();
            if (seg) items.push({ col: starts[i].col, text: seg });
          }
          if (items.length >= 2) return items;
        }

        var gapRx = /\S+(?: \S+)*/g;
        var gm;
        while ((gm = gapRx.exec(text)) !== null) {
          var clean = gm[0].replace(/^\((.+)\)$/, '$1').replace(/^[\u2022\u25CF\u25AA\-]\s*/, '').trim();
          if (clean) items.push({ col: gm.index, text: clean });
        }
        return items;
      }

      function parseAsciiFlowchart(preEl) {
        if (!preEl) return null;
        var codeEl = preEl.querySelector('code');
        if (codeEl && /language-(?!text\b|plaintext\b|ascii\b|none\b)[a-z0-9_-]+/i.test(codeEl.className || '')) {
          return null;
        }
        var rawText = (codeEl ? codeEl.textContent : preEl.textContent) || '';
        var normalized = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        var nonEmpty = [];
        var rawLines = normalized.split('\n');
        for (var i = 0; i < rawLines.length; i++) {
          if (rawLines[i].trim()) nonEmpty.push(rawLines[i]);
        }
        if (nonEmpty.length === 0) return null;

        var firstLine = nonEmpty[0];
        var hArrowRx = /(?:-{1,3}>|={1,2}>|[\u2500\u2501\u2550]{1,3}[\u25BA\u25B6>]|[\u2192\u279C])/;
        if (hArrowRx.test(firstLine)) {
          var bracketRx = /\[([^\]]+)\]/g;
          var matches = [];
          var m;
          while ((m = bracketRx.exec(firstLine)) !== null) {
            matches.push({ start: m.index, end: m.index + m[0].length, label: m[1].trim() });
          }
          if (matches.length >= 2) {
            var hSteps = [];
            for (var si = 0; si < matches.length; si++) {
              hSteps.push(splitStepTitleAndMeta(matches[si].label, ''));
            }
            for (var li = 1; li < nonEmpty.length; li++) {
              var subItems = parseHorizontalSubLine(nonEmpty[li]);
              if (subItems.length === 0) continue;
              if (subItems.length === hSteps.length) {
                for (var k = 0; k < subItems.length; k++) {
                  hSteps[k].details.push(subItems[k].text);
                }
              } else {
                for (var sj = 0; sj < subItems.length; sj++) {
                  var bestIdx = 0;
                  var bestDist = Infinity;
                  for (var stepIdx = 0; stepIdx < matches.length; stepIdx++) {
                    var dist = Math.abs(subItems[sj].col - matches[stepIdx].start);
                    if (dist < bestDist) {
                      bestDist = dist;
                      bestIdx = stepIdx;
                    }
                  }
                  hSteps[bestIdx].details.push(subItems[sj].text);
                }
              }
            }
            return { orientation: 'horizontal', steps: hSteps };
          }
        }

        if (/[\u2502\u25BC\u2193]/.test(normalized)) {
          var vSteps = [];
          var lastStep = null;
          for (var vi = 0; vi < nonEmpty.length; vi++) {
            var ln = nonEmpty[vi];
            var boxMatch = ln.match(/^\s*\[([^\]]+)\](?:\s*\(([^)]+)\))?\s*$/);
            if (boxMatch) {
              lastStep = splitStepTitleAndMeta(boxMatch[1], boxMatch[2] || '');
              vSteps.push(lastStep);
              continue;
            }
            if (/^\s*[\u2502|\u2193\u25BCv\s\-]+$/i.test(ln)) continue;
            var annMatch = ln.match(/^\s*[\u2502|\u2193\u25BCv]+\s*(?:\(([^)]+)\)|(.+))$/);
            if (annMatch && lastStep) {
              var annText = (annMatch[1] || annMatch[2] || '').replace(/\s+/g, ' ').trim();
              if (annText) lastStep.details.push(annText);
            }
          }
          if (vSteps.length >= 2) {
            return { orientation: 'vertical', steps: vSteps };
          }
        }

        return null;
      }

      function enhanceAsciiSteppers(sections, langCode) {
        if (!Array.isArray(sections)) return 0;
        var count = 0;
        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec || !sec.bodyEl) continue;
          var pres = Array.prototype.slice.call(sec.bodyEl.querySelectorAll('pre'));
          for (var pi = 0; pi < pres.length; pi++) {
            var pre = pres[pi];

            var parsed = parseAsciiFlowchart(pre);
            if (!parsed) continue;
            count++;
            buildFlowStepper(parsed, pre, count, langCode);
          }
        }
        return count;

      function buildEvidenceMap(evidenceSec, langCode) {
        var map = Object.create(null);

        vizState.evidenceSectionId = evidenceSec.id || null;

        var tbl = extractTableData(evidenceSec);
        if (!tbl || tbl.rowCount === 0) return { map: map, list: list };

        var idCol = 0, typeCol = 1, titleCol = 2, ctxCol = 3, urlCol = 4;
        for (var hi = 0; hi < tbl.normalizedHeaders.length; hi++) {
          var hdr = tbl.normalizedHeaders[hi];
          if (/\bid\b|source\s*id|id\s*sumber/.test(hdr)) idCol = hi;
          else if (/type|jenis|tipe/.test(hdr)) typeCol = hi;
          else if (/title|judul/.test(hdr)) titleCol = hi;
          else if (/company|context|perusahaan|konteks|platform|organi/.test(hdr)) ctxCol = hi;
          else if (/url|link|tautan/.test(hdr)) urlCol = hi;
        }

        for (var ri = 0; ri < tbl.rows.length; ri++) {
          var row = tbl.rows[ri];
          var idMatch = (row.cells[idCol] || row.cells.join(' ')).match(/([JYA]\d{2,})/i);
          if (!idMatch) continue;
          var id = idMatch[1].toUpperCase();
          var prefix = id.charAt(0);
          var category = prefix === 'Y' ? 'youtube' : (prefix === 'A' ? 'abroad' : 'job');
          var rawType = (row.cells[typeCol] || '').trim();
          var title = (row.cells[titleCol] || '').trim();
          var context = (row.cells[ctxCol] || '').trim();
          var url = '';
          var linkLabel = '';
          for (var li = 0; li < row.links.length; li++) {
            if (row.links[li].colIndex === urlCol || !url) {
              if (row.links[li].href) {
                url = row.links[li].href;
                linkLabel = row.links[li].text;

          var entry = {
            id: id,
            category: category,
            rawType: rawType,
            title: title,
            context: context,
            url: url,
            linkLabel: linkLabel,
            rowId: rowId,
            rowEl: row.rowEl || null,
            sectionId: evidenceSec.id || null,
            lang: langCode === 'id' ? 'id' : 'en'

          map[id] = entry;
          list.push(entry);

        vizState.evidenceMap = map;
        vizState.evidenceList = list;
        return { map: map, list: list };

      function expandCitationGroup(innerText) {
        var parts = String(innerText || '').split(',');
        var ids = [];
        var seen = Object.create(null);
        for (var i = 0; i < parts.length; i++) {
          var token = parts[i].trim();
          if (!token) continue;
          var rangeM = token.match(/^([JYA])(\d{2,})\s*[-\u2013\u2014]\s*([JYA])?(\d{2,})$/i);
          if (rangeM) {
            var pref1 = rangeM[1].toUpperCase();
            var pref2 = rangeM[3] ? rangeM[3].toUpperCase() : pref1;
            var startNum = parseInt(rangeM[2], 10);
            var endNum = parseInt(rangeM[4], 10);
            var padLen = rangeM[2].length;
            if (pref1 === pref2 && endNum >= startNum && (endNum - startNum) <= 20) {
              for (var n = startNum; n <= endNum; n++) {
                var numStr = String(n);
                while (numStr.length < padLen) numStr = '0' + numStr;
                var fullId = pref1 + numStr;
                if (!seen[fullId]) {
                  seen[fullId] = true;
                  ids.push(fullId);
                }
              }
              continue;
            }
          }
          var singleM = token.match(/^([JYA]\d{2,})$/i);
          if (singleM) {
            var sid = singleM[1].toUpperCase();
            if (!seen[sid]) {
              seen[sid] = true;
              ids.push(sid);
            }
          }
        }
        return ids;
      }

        pop.addEventListener('pointerenter', function (ev) {
          if (ev.pointerType && ev.pointerType !== 'mouse') return;
          if (hoverCloseTimer) {
            window.clearTimeout(hoverCloseTimer);
            hoverCloseTimer = null;
          }
        });

        pop.addEventListener('pointerleave', function (ev) {
          if (ev.pointerType && ev.pointerType !== 'mouse') return;
          if (!popoverPinned) schedulePopoverClose();
        });

        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape' && popoverEl && !popoverEl.hidden) {
            ev.preventDefault();
            closeCitationPopover(true);
          }
        });

        document.addEventListener('click', function (ev) {
          if (!popoverEl || popoverEl.hidden) return;
          if (popoverEl.contains(ev.target)) return;
          if (activeChip && activeChip.contains(ev.target)) return;
          closeCitationPopover(false);
        });

        var repositionOnScroll = function () {
          if (!popoverEl || popoverEl.hidden || !activeChip) return;
          if (popoverScrollScheduled) return;
          popoverScrollScheduled = true;
          window.requestAnimationFrame(function () {
            popoverScrollScheduled = false;
            if (!popoverEl || popoverEl.hidden || !activeChip) return;
            var r = activeChip.getBoundingClientRect();
            if (r.width === 0 && r.height === 0) {
              closeCitationPopover(false);
              return;
            }
            if (r.bottom < 0 || r.top > window.innerHeight) {
              closeCitationPopover(false);
              return;
            }
            positionPopover(activeChip);
          });
        };

        window.addEventListener('scroll', repositionOnScroll, { passive: true });
        window.addEventListener('resize', repositionOnScroll, { passive: true });

        document.body.appendChild(pop);
        popoverEl = pop;
        return pop;
      }

      function positionPopover(chip) {
        if (!popoverEl || !chip) return;
        var rect = chip.getBoundingClientRect();
        var vw = window.innerWidth || document.documentElement.clientWidth || 1024;
        var vh = window.innerHeight || document.documentElement.clientHeight || 768;
        var gutter = 12;
        var gap = 8;

        var popRect = popoverEl.getBoundingClientRect();
        var pw = popRect.width || Math.min(360, vw - gutter * 2);
        var ph = popRect.height || 180;

        var left = rect.left + (rect.width / 2) - (pw / 2);
        left = Math.max(gutter, Math.min(left, vw - pw - gutter));

        var placeTop = (rect.bottom + gap + ph > vh - gutter) && (rect.top - gap - ph >= gutter);
        var top = placeTop ? (rect.top - ph - gap) : (rect.bottom + gap);
        top = Math.max(gutter, Math.min(top, vh - ph - gutter));

        popoverEl.setAttribute('data-placement', placeTop ? 'top' : 'bottom');
        popoverEl.style.transform = 'translate3d(' + Math.round(left) + 'px, ' + Math.round(top) + 'px, 0)';
      }

      function openCitationPopover(chip, entry, opts) {
        if (!chip || !entry) return false;
        var lc = entry.lang === 'id' ? 'id' : lang;
        var vt = VIZ_I18N[lc];
        var pop = ensureCitationPopover(lc);

        if (hoverCloseTimer) {
          window.clearTimeout(hoverCloseTimer);
          hoverCloseTimer = null;
        }
        if (activeChip && activeChip !== chip) {
          activeChip.setAttribute('aria-expanded', 'false');
        }

        activeChip = chip;
        popoverPinned = !!(opts && opts.pin);
        chip.setAttribute('aria-expanded', 'true');

        pop.setAttribute('data-cite-id', entry.id);
        pop.setAttribute('data-source-type', entry.category);

        pop.querySelector('.cite-popover-id').textContent = '[' + entry.id + ']';

        var typePill = pop.querySelector('.cite-popover-type');
        typePill.replaceChildren();
        var iconKey = entry.category === 'youtube' ? VIZ_ICONS.youtube : (entry.category === 'abroad' ? VIZ_ICONS.abroad : VIZ_ICONS.job);
        typePill.appendChild(createSvgIcon(iconKey));
        var typeText = document.createElement('span');
        typeText.textContent = entry.category === 'youtube' ? vt.typeYoutube : (entry.category === 'abroad' ? vt.typeAbroad : vt.typeJob);
        typePill.appendChild(typeText);

        pop.querySelector('.cite-popover-title').textContent = entry.title || ('[' + entry.id + ']');
        var ctxEl = pop.querySelector('.cite-popover-context');
        ctxEl.textContent = entry.context || '';
        ctxEl.hidden = !entry.context;

        var extLink = pop.querySelector('.cite-action--primary');
        if (entry.url && isSafeHref(entry.url)) {
          extLink.href = entry.url;
          extLink.hidden = false;
        } else {
          extLink.removeAttribute('href');
          extLink.hidden = true;
        }

        pop.hidden = false;
        positionPopover(chip);
        return true;
      }

      function schedulePopoverClose() {
        if (hoverCloseTimer) window.clearTimeout(hoverCloseTimer);
        hoverCloseTimer = window.setTimeout(function () {
          hoverCloseTimer = null;
          if (!popoverPinned) closeCitationPopover(false);
        }, 220);
      }

      function closeCitationPopover(restoreFocus) {
        if (hoverOpenTimer) {
          window.clearTimeout(hoverOpenTimer);
          hoverOpenTimer = null;
        }
        if (hoverCloseTimer) {
          window.clearTimeout(hoverCloseTimer);
          hoverCloseTimer = null;
        }
        var prevChip = activeChip;
        if (prevChip) {
          prevChip.setAttribute('aria-expanded', 'false');
        }
        activeChip = null;
        popoverPinned = false;
        if (popoverEl) {
          popoverEl.hidden = true;
        }
        if (restoreFocus && prevChip && typeof prevChip.focus === 'function') {
          prevChip.focus({ preventScroll: true });
        }
      }

      function navigateToEvidence(citeId) {
        var key = String(citeId || '').toUpperCase();
        var entry = vizState.evidenceMap[key];
        if (!entry) return false;

        if (vizState.evidenceFilter && entry.rowEl && entry.rowEl.hidden) {
          resetEvidenceFilter();
        }
        if (entry.sectionId) {
          setSectionExpanded(entry.sectionId, true, { animate: false, persist: true, source: 'citation' });
        }
        var targetEl = entry.rowEl || document.getElementById(entry.rowId);
        if (!targetEl) return false;

        if (activeHighlightedRow && activeHighlightedRow !== targetEl) {
          activeHighlightedRow.classList.remove('is-row-highlight');
        }
        if (rowHighlightTimer) {
          window.clearTimeout(rowHighlightTimer);
          rowHighlightTimer = null;
        }

        scrollIntoViewAsync(targetEl, {
          behavior: isReducedMotion() ? 'auto' : 'smooth',
          block: 'center'
        }).then(function () {
          targetEl.classList.add('is-row-highlight');
          activeHighlightedRow = targetEl;
          rowHighlightTimer = window.setTimeout(function () {
            targetEl.classList.remove('is-row-highlight');
            rowHighlightTimer = null;
          }, 1400);
        });
        return true;
      }

      function enhanceInlineCitations(sections, evidenceMap, langCode) {
        if (!Array.isArray(sections) || !evidenceMap) return 0;
        var citeGroupRx = /\[([JYA]\d{2,}(?:\s*(?:,|[-–—])\s*(?:[JYA])?\d{2,})*)\]/gi;
        var chipCount = 0;

        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec || !sec.bodyEl || sec.sectionType === 'evidence') continue;

          var walker = document.createTreeWalker(sec.bodyEl, NodeFilter.SHOW_TEXT, {
            acceptNode: function (node) {
              if (!node.nodeValue || node.nodeValue.indexOf('[') === -1) return NodeFilter.FILTER_REJECT;
              var p = node.parentElement;
              if (!p) return NodeFilter.FILTER_REJECT;
              if (p.closest('a, button, pre, code, script, style, .flow-stepper, .table-filter-bar, .cite-popover')) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            }
          });

          var textNodes = [];
          var cur;
          while ((cur = walker.nextNode()) !== null) {
            textNodes.push(cur);
          }

          for (var ti = 0; ti < textNodes.length; ti++) {
            var tn = textNodes[ti];
            var str = tn.nodeValue;
            citeGroupRx.lastIndex = 0;
            if (!citeGroupRx.test(str)) continue;
            citeGroupRx.lastIndex = 0;

            var frag = document.createDocumentFragment();
            var lastIndex = 0;
            var changed = false;
            var m;

            while ((m = citeGroupRx.exec(str)) !== null) {
              var ids = expandCitationGroup(m[1]);
              var mapped = [];
              for (var ii = 0; ii < ids.length; ii++) {
                if (evidenceMap[ids[ii]]) mapped.push(ids[ii]);
              }
              if (mapped.length === 0) continue;

              changed = true;
              if (m.index > lastIndex) {
                frag.appendChild(document.createTextNode(str.slice(lastIndex, m.index)));
              }

              var container = mapped.length > 1 ? document.createElement('span') : frag;
              if (mapped.length > 1) container.className = 'cite-group';

              for (var mi = 0; mi < mapped.length; mi++) {
                var cid = mapped[mi];
                var entry = evidenceMap[cid];
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cite-chip cite-chip--' + entry.category;
                btn.setAttribute('data-cite', cid);
                btn.setAttribute('aria-haspopup', 'dialog');
                btn.setAttribute('aria-expanded', 'false');
                btn.textContent = '[' + cid + ']';

                (function (chipBtn, citeEntry) {
                  chipBtn.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    if (popoverEl && !popoverEl.hidden && activeChip === chipBtn && popoverPinned) {
                      closeCitationPopover(false);
                    } else {
                      openCitationPopover(chipBtn, citeEntry, { pin: true });
                    }
                  });
                  chipBtn.addEventListener('pointerenter', function (ev) {
                    if (ev.pointerType && ev.pointerType !== 'mouse') return;
                    if (popoverPinned && activeChip && activeChip !== chipBtn) return;
                    if (hoverOpenTimer) window.clearTimeout(hoverOpenTimer);
                    hoverOpenTimer = window.setTimeout(function () {
                      hoverOpenTimer = null;
                      openCitationPopover(chipBtn, citeEntry, { pin: popoverPinned && activeChip === chipBtn });
                    }, 140);
                  });
                  chipBtn.addEventListener('pointerleave', function (ev) {
                    if (ev.pointerType && ev.pointerType !== 'mouse') return;
                    if (hoverOpenTimer) {
                      window.clearTimeout(hoverOpenTimer);
                      hoverOpenTimer = null;
                    }
                    if (!popoverPinned) schedulePopoverClose();
                  });
                })(btn, entry);

                container.appendChild(btn);
                chipCount++;
              }

              if (mapped.length > 1) frag.appendChild(container);
              lastIndex = m.index + m[0].length;
            }

            if (changed) {
              if (lastIndex < str.length) {
                frag.appendChild(document.createTextNode(str.slice(lastIndex)));
              }
              if (tn.parentNode) tn.parentNode.replaceChild(frag, tn);
            }
          }
        }

        vizState.citeChipsCount = chipCount;
        return chipCount;
      }

      var DEMAND_CRITICAL_RX = /mission[\s-]*critical|\bcritical\b|must[\s-]*have|\bmandatory\b|sangat\s+kritis|\bkritis\b|\bwajib/i;
      var DEMAND_MODERATE_RX = /moderate|medium|niche|emerging|specialized|growing|sedang|menengah|khusus|muncul|berkembang\s*&?\s*strategis|bernilai\s+tinggi/i;
      var DEMAND_HIGH_RX = /\bhigh\b|\bessential\b|\btinggi\b|\besensial\b/i;

      function classifySkillDemand(rawText) {
        var s = String(rawText || '').trim();
        if (!s) return 'moderate';
        if (DEMAND_CRITICAL_RX.test(s)) return 'critical';
        if (DEMAND_MODERATE_RX.test(s)) return 'moderate';
        if (DEMAND_HIGH_RX.test(s)) return 'high';
        return 'moderate';
      }

      function enhanceSkillsTable(skillsSec, langCode) {
        if (!skillsSec || !skillsSec.bodyEl) return false;
        var tableEl = findTableElement(skillsSec);
        if (!tableEl) return false;
        var wrap = tableEl.closest('.table-wrapper, .table-scroll') || tableEl;

        var tbl = extractTableData(tableEl);
        if (!tbl || tbl.rowCount === 0) return false;

        var demandCol = tbl.colCount >= 3 ? 2 : (tbl.colCount >= 2 ? 1 : -1);
        for (var hi = 0; hi < tbl.normalizedHeaders.length; hi++) {
          if (/demand|level|permintaan|tingkat/.test(tbl.normalizedHeaders[hi])) {
            demandCol = hi;
            break;
          }
        }
        if (demandCol === -1) return false;

        var lc = langCode === 'id' ? 'id' : 'en';
        var vt = VIZ_I18N[lc];
        var counts = { all: tbl.rows.length, critical: 0, high: 0, moderate: 0 };
        var rowEntries = [];

        for (var ri = 0; ri < tbl.rows.length; ri++) {
          var row = tbl.rows[ri];
          var tier = classifySkillDemand(row.cells[demandCol] || '');
          counts[tier]++;
          if (row.rowEl) {
            row.rowEl.setAttribute('data-table-role', 'skills');
            row.rowEl.setAttribute('data-demand-tier', tier);
            var targetTd = row.rowEl.querySelectorAll('td, th')[demandCol];
            if (targetTd) {
              var badge = document.createElement('span');
              badge.className = 'demand-badge demand-badge--' + tier;
              badge.textContent = (targetTd.textContent || '').trim();
              targetTd.replaceChildren(badge);
            }
          }
          rowEntries.push({ tr: row.rowEl, tier: tier });
        }

        var bar = document.createElement('div');
        bar.className = 'table-filter-bar table-filter-bar--skills';
        bar.setAttribute('data-table-filter', 'skills');

        var topRow = document.createElement('div');
        topRow.className = 'table-filter-row';

        var pillsGroup = document.createElement('div');
        pillsGroup.className = 'filter-pills';
        pillsGroup.setAttribute('role', 'group');
        pillsGroup.setAttribute('aria-label', vt.skillsFilterLabel);

        var countLabel = document.createElement('span');
        countLabel.className = 'table-filter-count';
        countLabel.setAttribute('aria-live', 'polite');

        var specs = [
          { key: 'all', label: vt.filterAll, count: counts.all },
          { key: 'critical', label: vt.demandCritical, count: counts.critical },
          { key: 'high', label: vt.demandHigh, count: counts.high },
          { key: 'moderate', label: vt.demandModerate, count: counts.moderate }
        ];
        var pillBtns = [];

        function applySkillsFilter(tierKey) {
          var activeKey = tierKey || 'all';
          var shown = 0;
          for (var i = 0; i < rowEntries.length; i++) {
            var match = (activeKey === 'all' || rowEntries[i].tier === activeKey);
            if (rowEntries[i].tr) rowEntries[i].tr.hidden = !match;
            if (match) shown++;
          }
          for (var bi = 0; bi < pillBtns.length; bi++) {
            var isPressed = pillBtns[bi].getAttribute('data-skill-filter') === activeKey;
            pillBtns[bi].setAttribute('aria-pressed', isPressed ? 'true' : 'false');
          }
          countLabel.textContent = vt.skillsCount(shown, rowEntries.length);
          return shown;
        }

        for (var si = 0; si < specs.length; si++) {
          if (specs[si].key !== 'all' && specs[si].count === 0) continue;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-pill';
          btn.setAttribute('data-skill-filter', specs[si].key);
          btn.setAttribute('aria-pressed', specs[si].key === 'all' ? 'true' : 'false');

          var txt = document.createElement('span');
          txt.textContent = specs[si].label;
          var num = document.createElement('span');
          num.className = 'filter-pill-count';
          num.textContent = String(specs[si].count);

          btn.appendChild(txt);
          btn.appendChild(num);
          (function (key) {
            btn.addEventListener('click', function () {
              applySkillsFilter(key);
            });
          })(specs[si].key);

          pillsGroup.appendChild(btn);
          pillBtns.push(btn);
        }

        topRow.appendChild(pillsGroup);
        topRow.appendChild(countLabel);
        bar.appendChild(topRow);

        wrap.parentNode.insertBefore(bar, wrap);
        applySkillsFilter('all');

        vizState.skillsFilter = {
          apply: applySkillsFilter,
          reset: function () { return applySkillsFilter('all'); }
        };
        return true;
      }

      function enhanceEvidenceTable(evidenceSec, evidenceMap, langCode) {

        if (!tableEl) return false;
        var wrap = tableEl.closest('.table-wrapper, .table-scroll') || tableEl;

        var rows = [];

        var bodyTrs = tableEl.querySelectorAll('tbody tr');

          var stype = tr.getAttribute('data-source-type') || 'job';

          counts.all++;
          if (counts[stype] !== undefined) counts[stype]++;
          rows.push({ tr: tr, type: stype, searchText: stext });
        }
        if (rows.length === 0) return false;

        var lc = langCode === 'id' ? 'id' : 'en';
        var vt = VIZ_I18N[lc];

        var bar = document.createElement('div');

        var tabsGroup = document.createElement('div');

        row2.appendChild(searchWrap);

        var tbody = tableEl.querySelector('tbody');
        var emptyTr = document.createElement('tr');

        emptyTr.hidden = true;
        var emptyTd = document.createElement('td');
        emptyTd.className = 'table-empty-cell';
        emptyTd.colSpan = Math.max(1, tableEl.querySelectorAll('thead th').length || 5);
        var emptyMsg = document.createElement('span');
        emptyMsg.textContent = vt.noMatches;
        var resetBtn = document.createElement('button');
        resetBtn.type = 'button';
        resetBtn.className = 'table-empty-reset';
        resetBtn.textContent = vt.resetFilters;
        emptyTd.appendChild(emptyMsg);
        emptyTd.appendChild(resetBtn);
        emptyTr.appendChild(emptyTd);
        if (tbody) tbody.appendChild(emptyTr);

        var currentType = 'all';
        var currentQuery = '';
        var tabBtns = [];

        function applyEvidenceFilter(nextType, nextQuery) {
          if (typeof nextType === 'string') currentType = nextType;
          if (typeof nextQuery === 'string') currentQuery = nextQuery;
          var q = currentQuery.trim().toLowerCase();
          var shown = 0;

          for (var ri = 0; ri < rows.length; ri++) {
            var item = rows[ri];
            var typeOk = (currentType === 'all' || item.type === currentType);
            var queryOk = (!q || item.searchText.indexOf(q) !== -1);
            var visible = typeOk && queryOk;
            item.tr.hidden = !visible;
            if (visible) shown++;
          }

          emptyTr.hidden = shown > 0;
          countEl.textContent = vt.evCount(shown, rows.length);

          for (var bi = 0; bi < tabBtns.length; bi++) {
            var pressed = tabBtns[bi].getAttribute('data-ev-filter') === currentType;
            tabBtns[bi].setAttribute('aria-pressed', pressed ? 'true' : 'false');
          }
          return shown;
        }

        var tabSpecs = [
          { key: 'all', label: vt.filterAll, count: counts.all },
          { key: 'job', label: vt.evTabJobs, count: counts.job },
          { key: 'youtube', label: vt.evTabYoutube, count: counts.youtube },
          { key: 'abroad', label: vt.evTabAbroad, count: counts.abroad }
        ];

        for (var ti = 0; ti < tabSpecs.length; ti++) {
          if (tabSpecs[ti].key !== 'all' && tabSpecs[ti].count === 0) continue;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-pill';
          btn.setAttribute('data-ev-filter', tabSpecs[ti].key);
          btn.setAttribute('aria-pressed', tabSpecs[ti].key === 'all' ? 'true' : 'false');

          var lbl = document.createElement('span');
          lbl.textContent = tabSpecs[ti].label;
          var num = document.createElement('span');
          num.className = 'filter-pill-count';
          num.textContent = String(tabSpecs[ti].count);

          btn.appendChild(lbl);
          btn.appendChild(num);
          (function (key) {
            btn.addEventListener('click', function () {
              applyEvidenceFilter(key, currentQuery);
            });
          })(tabSpecs[ti].key);

          tabsGroup.appendChild(btn);
          tabBtns.push(btn);
        }

        searchInput.addEventListener('input', function () {
          applyEvidenceFilter(currentType, searchInput.value);
        });

        resetBtn.addEventListener('click', function () {
          searchInput.value = '';
          applyEvidenceFilter('all', '');
          searchInput.focus();
        });

        row1.appendChild(tabsGroup);
        bar.appendChild(row1);
        bar.appendChild(row2);
        wrap.parentNode.insertBefore(bar, wrap);

        applyEvidenceFilter('all', '');

        vizState.evidenceFilter = {
          apply: function (typeKey, query) {
            if (typeof query === 'string') searchInput.value = query;
            return applyEvidenceFilter(typeKey, query);
          },
          reset: function () {
            searchInput.value = '';
            return applyEvidenceFilter('all', '');
          }
        };
        return true;
      }

      function filterSkillsTable(tierKey) {
        return vizState.skillsFilter ? vizState.skillsFilter.apply(tierKey) : 0;
      }

      function resetSkillsFilter() {
        return vizState.skillsFilter ? vizState.skillsFilter.reset() : 0;
      }

      function filterEvidenceTable(typeKey, query) {
        return vizState.evidenceFilter ? vizState.evidenceFilter.apply(typeKey, query) : 0;
      }

      function resetEvidenceFilter() {
