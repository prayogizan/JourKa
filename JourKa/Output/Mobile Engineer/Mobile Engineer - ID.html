        if (navState.search.debounceTimer) {
          window.clearTimeout(navState.search.debounceTimer);
          navState.search.debounceTimer = null;
        }
        if (searchInputEl) searchInputEl.value = '';
        var res = executeSearch('', { restore: !opts || opts.restoreSnapshot !== false });
        if (opts && opts.focusInput && searchInputEl) {
          searchInputEl.focus({ preventScroll: true });
        }
        updateSearchKbdVisibility();
        return res;
      }

      function initInstantSearch() {
        if (!searchInputEl) return;
        searchInputEl.removeAttribute('aria-disabled');
        searchInputEl.removeAttribute('readonly');
        updateSearchKbdVisibility();

        searchInputEl.addEventListener('focus', updateSearchKbdVisibility);
        searchInputEl.addEventListener('blur', updateSearchKbdVisibility);

        searchInputEl.addEventListener('input', function () {
          if (searchClearEl) searchClearEl.hidden = searchInputEl.value.length === 0;
          updateSearchKbdVisibility();
          if (navState.search.debounceTimer) window.clearTimeout(navState.search.debounceTimer);
          var val = searchInputEl.value;
          navState.search.debounceTimer = window.setTimeout(function () {
            navState.search.debounceTimer = null;
            executeSearch(val);
          }, 120);
        });

        searchInputEl.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            if (navState.search.debounceTimer) {
              window.clearTimeout(navState.search.debounceTimer);
              navState.search.debounceTimer = null;
              executeSearch(searchInputEl.value);
            }
            if (navState.search.hits.length > 0) {
              var delta = ev.shiftKey ? -1 : 1;
              setCurrentSearchHit(navState.search.currentIndex + delta, { scroll: true, announce: true });
            }
          }
        });

        if (searchClearEl) {
          searchClearEl.addEventListener('click', function () {
            clearSearch({ restoreSnapshot: true, focusInput: true });
          });
        }
        if (searchEmptyResetEl) {
          searchEmptyResetEl.addEventListener('click', function () {
            clearSearch({ restoreSnapshot: true, focusInput: true });
          });
        }

        document.addEventListener('keydown', function (ev) {
          var key = (ev.key || '').toLowerCase();
          if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && key === 'k') {
            ev.preventDefault();
            closeTocDrawer();
            searchInputEl.focus();
            searchInputEl.select();
            return;
          }

          if (ev.key === '/' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
            var tgt = ev.target;
            var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : '';
            if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT' && !(tgt && tgt.isContentEditable)) {
              ev.preventDefault();
              searchInputEl.focus();
              searchInputEl.select();
              return;
            }
          }

          if (ev.key === 'Escape') {
            var pop = document.getElementById('cite-popover');
            var drawer = document.getElementById('toc-drawer');
            if ((pop && !pop.hidden) || (drawer && drawer.open)) return;
            if (navState.search.active || searchInputEl.value.length > 0) {
              ev.preventDefault();
              var wasFocused = document.activeElement === searchInputEl;
              clearSearch({ restoreSnapshot: true, focusInput: false });
              if (wasFocused) searchInputEl.blur();
            }
          }
        });
      }

      function initPrintGuards() {
        window.addEventListener('beforeprint', function () {
          closeCitationPopover(false);
          closeTocDrawer();
        });
      }

      function initNavigationSuite() {
        renderInteractiveToc(normalizedResult.sections);
        initTocScrollSpy();
        initViewModeSwitcher();
        initInstantSearch();
        initPrintGuards();
      }

      initNavigationSuite();

      if (window.location.hash && window.location.hash.length > 1) {
        applyHashExpansion({ scroll: true });
        syncTocExpandedStates();
        syncViewModeButtons();
      }

      var parserApi = {
        engine: parsedResult.engine,
        normalizeMarkdownInput: normalizeMarkdownInput,
        fallbackMarkdownToHtml: fallbackMarkdownToHtml,
        parseMarkdown: parseMarkdown,
        sanitizeHtmlToFragment: sanitizeHtmlToFragment,
        isSafeHref: isSafeHref,
        classifySection: classifySection,
        getSectionIconSvg: getSectionIconSvg,
        normalizeSections: normalizeSections,
        extractTableData: extractTableData,
        extractPlainText: extractPlainText,
        extractPlainSentences: extractPlainSentences,
        getSections: function () { return normalizedResult.sections; },
        getStats: function () { return normalizedResult.stats; }
      };

      var bentoApi = {
        extractBentoData: extractBentoData,
        extractDegreeVerdict: extractDegreeVerdict,
        extractCoreCompetencies: extractCoreCompetencies,
        parseIdrAmounts: parseIdrAmounts,
        formatIdrNumber: formatIdrNumber,
        extractEntrySalaryBand: extractEntrySalaryBand,
        extractEvidenceCounts: extractEvidenceCounts,
        renderBentoGrid: renderBentoGrid,
        scrollToAndExpandSection: scrollToAndExpandSection,
        getData: function () { return bentoData; }
      };

      var accordionApi = {
        storageKey: accordionStorageKey,
        extractSectionTldr: extractSectionTldr,
        extractSectionTopicPills: extractSectionTopicPills,
        extractSectionPreview: extractSectionPreview,
        renderTier1Accordions: renderTier1Accordions,
        setSectionExpanded: setSectionExpanded,
        expandSection: expandSection,
        collapseSection: collapseSection,
        toggleSection: toggleSection,
        expandAll: expandAll,
        collapseAll: collapseAll,
        getExpandedSectionIds: getExpandedSectionIds,
        getCard: resolveSectionCard,
        applyHashExpansion: applyHashExpansion
      };

      var tier2Api = {
        checkStorageKey: checkStorageKey,
        enhanceTier2Sections: enhanceTier2Sections,
        enhancePortfolioBlueprints: enhancePortfolioBlueprints,
        enhanceOnboardingPlaybook: enhanceOnboardingPlaybook,
        enhanceSemanticCallouts: enhanceSemanticCallouts,
        enhanceMentorDeepDives: enhanceMentorDeepDives,
        setBlueprintExpanded: setBlueprintExpanded,
        toggleBlueprint: toggleBlueprint,
        selectOnboardingPhase: function (phaseKey) {
          if (tier2State.playbook) tier2State.playbook.selectPhase(phaseKey, false);
        },
        getOnboardingProgress: function () {
          return tier2State.playbook ? tier2State.playbook.getProgress() : { done: 0, total: 0 };
        },
        resetOnboardingChecks: function () {
          if (tier2State.playbook) tier2State.playbook.reset();
        },
        setDeepDiveExpanded: setDeepDiveExpanded,
        toggleDeepDive: toggleDeepDive,
        expandAllTier2: expandAllTier2,
        collapseAllTier2: collapseAllTier2,
        revealElement: revealElement,
        getStats: function () { return tier2Stats; }
      };

      var vizApi = {
        buildEvidenceMap: buildEvidenceMap,
        parseAsciiFlowchart: parseAsciiFlowchart,
        enhanceAsciiSteppers: enhanceAsciiSteppers,
        expandCitationGroup: expandCitationGroup,
        enhanceInlineCitations: enhanceInlineCitations,
        classifySkillDemand: classifySkillDemand,
        enhanceFilterableTables: enhanceFilterableTables,
        enhanceInteractiveVisualizations: enhanceInteractiveVisualizations,
        openCitationPopover: openCitationPopover,
        closeCitationPopover: closeCitationPopover,
        navigateToEvidence: navigateToEvidence,
        toggleRawDiagram: toggleRawDiagram,
        filterSkillsTable: filterSkillsTable,
        resetSkillsFilter: resetSkillsFilter,
        filterEvidenceTable: filterEvidenceTable,
        resetEvidenceFilter: resetEvidenceFilter,
        getEvidenceMap: function () { return vizState.evidenceMap; },
        getEvidenceEntry: function (id) { return vizState.evidenceMap[String(id || '').toUpperCase()] || null; },
        getStats: function () { return vizStats; }
      };

      var navApi = {
        getViewMode: function () { return navState.viewMode; },
        setViewMode: setViewMode,
        syncViewModeButtons: syncViewModeButtons,
        search: function (query) {
          if (searchInputEl) searchInputEl.value = String(query || '');
          return executeSearch(query);
        },
        clearSearch: clearSearch,
        nextSearchMatch: function () {
          return setCurrentSearchHit(navState.search.currentIndex + 1, { scroll: true, announce: true });
        },
        prevSearchMatch: function () {
          return setCurrentSearchHit(navState.search.currentIndex - 1, { scroll: true, announce: true });
        },
        getSearchState: function () {
          return {
            active: navState.search.active,
            query: navState.search.query,
            totalHits: navState.search.hits.length,
            matchedSections: navState.search.matchedSections,
            currentIndex: navState.search.currentIndex
          };
        },
        setActiveToc: setActiveToc,
        syncTocExpandedStates: syncTocExpandedStates,
        navigateToSection: navigateToSection,
        refreshToc: function () {
          renderInteractiveToc(normalizedResult.sections);
        },
        i18n: I18N
      };

      window.JourKaI18N = I18N;
      window.JourKaParser = parserApi;
      window.JourKaBento = bentoApi;
      window.JourKaAccordion = accordionApi;
      window.JourKaTier2 = tier2Api;
      window.JourKaViz = vizApi;
      window.JourKaNav = navApi;
      window.JourKaShell = {
        lang: lang,
        getTheme: getTheme,
        setTheme: setTheme,
        updateVitals: updateVitals,
        wrapTables: wrapTables,
        populateBasicToc: populateBasicToc,
        closeTocDrawer: closeTocDrawer,
        scrollToAndExpandSection: scrollToAndExpandSection,
        expandSection: expandSection,
        collapseSection: collapseSection,
        toggleSection: toggleSection,
        expandAll: expandAll,
        collapseAll: collapseAll,
        getExpandedSectionIds: getExpandedSectionIds,
        revealElement: revealElement,
        expandAllTier2: expandAllTier2,
        collapseAllTier2: collapseAllTier2,
        parser: parserApi,
        bento: bentoApi,
        accordion: accordionApi,
        tier2: tier2Api,
        viz: vizApi,
        nav: navApi,
        i18n: I18N,
        sections: normalizedResult.sections
      };
    })();
  </script>
</body>
