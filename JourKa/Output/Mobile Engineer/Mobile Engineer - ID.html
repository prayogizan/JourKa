<!DOCTYPE html>
<html lang="id" data-jourka-ui="v2" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Mobile Engineer - Dosier Karier (ID)</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('jourka_theme'); } catch (e) { }
      var sysDark = false;
      try { sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { }
      var theme = (stored === 'dark' || stored === 'light') ? stored : (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) { meta.setAttribute('content', (stored === 'dark' || stored === 'light') ? stored : 'light dark'); }
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-toolbar: rgba(255, 255, 255, 0.84);
      --border: #e2e8f0;
      --border-control: #64748b;
      --ink-primary: #0f172a;
      --ink-body: #334155;
      --ink-muted: #64748b;
      --ink-muted-subtle: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --emerald: #059669;
      --emerald-text: #047857;
      --emerald-soft: #ecfdf5;
      --amber: #d97706;
      --amber-text: #b45309;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-text: #be123c;
      --rose-soft: #fff1f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      --toolbar-h: 60px;
      --font-sans: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-canvas: #0b1120;
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --bg-toolbar: rgba(17, 24, 39, 0.84);
      --border: #1f2937;
      --border-control: #64748b;
      --ink-primary: #f8fafc;
      --ink-body: #cbd5e1;
      --ink-muted: #94a3b8;
      --ink-muted-subtle: #cbd5e1;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --accent-soft: #172554;
      --emerald: #34d399;
      --emerald-text: #6ee7b7;
      --emerald-soft: #064e3b;
      --amber: #fbbf24;
      --amber-text: #fcd34d;
      --amber-soft: #451a03;
      --rose: #fb7185;
      --rose-text: #fda4af;
      --rose-soft: #4c0519;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      overflow-x: clip;
      scroll-behavior: smooth;
      accent-color: var(--accent);
      scrollbar-color: var(--border-control) transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: clip;
      background-color: var(--bg-canvas);
      color: var(--ink-body);
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }

    /* Accessibility utilities */
    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    .skip-link {
      position: fixed;
      inset-block-start: 10px;
      inset-inline-start: 12px;
      z-index: 200;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--ink-primary);
      border: 2px solid var(--accent);
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      box-shadow: var(--shadow-md);
    }

    :where(a:any-link, button, input, [tabindex="0"]):focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* Fixed 3px Reading Progress Bar */
    .reading-progress {
      position: fixed;
      inset-block-start: 0;
      inset-inline: 0;
      block-size: 3px;
      background: var(--accent);
      transform-origin: 0 50%;
      transform: scaleX(0);
      z-index: 120;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      @supports (animation-timeline: scroll()) {
        @keyframes jourka-scroll-progress {
          from {
            transform: scaleX(0);
          }

          to {
            transform: scaleX(1);
          }
        }

        .reading-progress {
          animation: jourka-scroll-progress auto linear both;
          animation-timeline: scroll(root block);
        }
      }
    }

    /* Sticky Glassmorphism App Toolbar */
    .app-toolbar {
      position: sticky;
      inset-block-start: 0;
      z-index: 90;
      min-block-size: var(--toolbar-h);
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @supports not ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
      .app-toolbar {
        background: var(--bg-surface);
      }
    }

    .toolbar-inner {
      max-width: 1240px;
      margin-inline: auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .toolbar-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 28px;
      block-size: 28px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.8125rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toolbar-role-badge {
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-inline-size: 220px;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .segmented-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-muted-subtle);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-block-size: 28px;
      line-height: 1;
    }

    .seg-btn[aria-current="true"],
    .seg-btn.is-active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: var(--shadow-sm);
    }

    .seg-btn[aria-disabled="true"] {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .toolbar-search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .search-icon {
      position: absolute;
      inset-inline-start: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      pointer-events: none;
    }

    .search-icon svg {
      inline-size: 14px;
      block-size: 14px;
    }

    .toolbar-search {
      inline-size: 210px;
      min-block-size: 32px;
      padding: 5px 58px 5px 30px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-control);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.8125rem;
      transition: inline-size 160ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .toolbar-search:focus {
      inline-size: 250px;
      border-color: var(--accent);
    }

    .toolbar-search::-webkit-search-cancel-button,
    .toolbar-search::-webkit-search-decoration {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }

    .toolbar-search::placeholder {
      color: var(--ink-muted);
    }

    .toolbar-search[aria-disabled="true"] {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .search-kbd {
      position: absolute;
      inset-inline-end: 8px;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--ink-muted-subtle);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 600;
      line-height: 1.3;
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      inset-inline-end: 4px;
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 24px;
      block-size: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink-muted-subtle);
      cursor: pointer;
    }

    .search-clear-btn:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .search-clear-btn svg {
      inline-size: 14px;
      block-size: 14px;
    }

    .search-clear-btn[hidden],
    .search-kbd[hidden],
    .search-count[hidden] {
      display: none;
    }

    .search-count {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-muted-subtle);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px 9px;
      white-space: nowrap;
      line-height: 1.3;
    }

    .search-count--zero {
      background: var(--amber-soft);
      color: var(--amber-text);
      border-color: var(--amber);
    }

    .tool-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-block-size: 32px;
      min-inline-size: 32px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-control);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .tool-btn:hover {
      background: var(--bg-subtle);
    }

    .tool-btn svg {
      inline-size: 16px;
      block-size: 16px;
      flex-shrink: 0;
    }

    /* Theme icon visibility driven purely by html[data-theme] */
    :root[data-theme="light"] .icon-sun {
      display: none;
    }

    :root[data-theme="dark"] .icon-moon {
      display: none;
    }

    /* Responsive 2-Column Workspace */
    .app-workspace {
      max-width: 1240px;
      margin-inline: auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 260px minmax(0, 880px);
      gap: 28px;
      justify-content: center;
      align-items: start;
    }

    .toc-sidebar {
      position: sticky;
      inset-block-start: calc(var(--toolbar-h) + 20px);
      max-block-size: calc(100vh - var(--toolbar-h) - 40px);
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .toc-heading {
      margin: 0 0 12px 0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toc-link {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      border-left: 3px solid transparent;
      color: var(--ink-body);
      text-decoration: none;
      font-size: 0.8125rem;
      line-height: 1.38;
      font-weight: 500;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .toc-link:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .toc-link.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .toc-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .toc-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .toc-icon svg {
      inline-size: 14px;
      block-size: 14px;
    }

    .toc-link.is-active .toc-icon {
      color: var(--accent);
    }

    .toc-label {
      flex: 1 1 auto;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .toc-match-badge {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0 5px;
      border-radius: var(--radius-pill);
      background: var(--amber-soft);
      color: var(--amber-text);
      border: 1px solid var(--amber);
      line-height: 1.5;
      margin-top: 1px;
    }

    .toc-match-badge[hidden] {
      display: none;
    }

    .toc-status-dot {
      inline-size: 7px;
      block-size: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
      border: 1.5px solid var(--border-control);
      background: transparent;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .toc-link[data-section-expanded="true"] .toc-status-dot {
      background: var(--emerald);
      border-color: var(--emerald);
    }

    .main-canvas {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Upgraded Hero Banner */
    .banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 26px 28px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    :root[data-theme="dark"] .banner {
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
      border-color: #1e293b;
    }

    .banner-eyebrow {
      margin: 0 0 6px 0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cbd5e1;
    }

    .banner h1 {
      margin: 0 0 14px 0;
      padding: 0;
      border: 0;
      color: #ffffff;
      font-size: clamp(1.375rem, 2.2vw, 1.75rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .banner .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.75rem;
    }

    .banner .pill {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #f8fafc;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      line-height: 1.3;
    }

    .hero-vitals {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .vital-sep {
      color: #94a3b8;
    }

    /* Tier 0 Executive Bento KPI Summary Grid (JK-FE-005) */
    .bento-slot[hidden] {
      display: none;
    }

    .bento-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .bento-card {
      position: relative;
      container: bento-card / inline-size;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      padding: 14px 15px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    @media (prefers-reduced-motion: no-preference) {
      .bento-card {
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .bento-card:has(a.bento-card-link:hover) {
        transform: translateY(-2px);
      }
    }

    .bento-card:hover,
    .bento-card:has(a.bento-card-link:hover) {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .bento-card a.bento-card-link {
      color: inherit;
      text-decoration: none;
    }

    .bento-card a.bento-card-link::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
    }

    .bento-card a.bento-card-link:focus-visible {
      outline: none;
    }

    .bento-card:focus-within,
    .bento-card:has(a.bento-card-link:focus-visible) {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .bento-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .bento-icon {
      inline-size: 28px;
      block-size: 28px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bento-icon svg {
      inline-size: 16px;
      block-size: 16px;
    }

    .bento-title {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted-subtle);
      line-height: 1.3;
      min-width: 0;
    }

    .bento-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .bento-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.25;
      max-width: 100%;
    }

    .bento-badge svg {
      inline-size: 13px;
      block-size: 13px;
      flex-shrink: 0;
    }

    .bento-badge--required {
      background: var(--rose-soft);
      color: var(--rose-text);
      border-color: var(--rose);
    }

    .bento-badge--preferred {
      background: var(--accent-soft);
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .bento-badge--optional {
      background: var(--emerald-soft);
      color: var(--emerald-text);
      border-color: var(--emerald);
    }

    .bento-badge--neutral {
      background: var(--bg-subtle);
      color: var(--ink-muted-subtle);
      border-color: var(--border-control);
    }

    .bento-snippet {
      margin: 0;
      font-size: 0.78125rem;
      line-height: 1.45;
      color: var(--ink-body);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }

    .bento-metric {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--ink-primary);
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }

    .bento-salary-range {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 800;
      color: var(--ink-primary);
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
      overflow-wrap: break-word;
    }

    .bento-nowrap {
      white-space: nowrap;
    }

    .bento-caption {
      margin: 0;
      font-size: 0.75rem;
      color: var(--ink-muted-subtle);
      line-height: 1.35;
    }

    .bento-pills {
      display: flex;
      flex-wrap: wrap;
      flex-wrap: balance;
      gap: 5px;
      min-width: 0;

    /* Editorial Content Surface */
    .dossier-content {

    .dossier-content h2 {

    .dossier-content a {

    .dossier-content a:hover {

    .dossier-content blockquote {

    .dossier-content code {

    /* Responsive Table Wrapper */
    .table-wrapper,

    .table-scroll--tall {

    .dossier-content table {

      margin: 0;
      font-size: 0.8125rem;
    }

    .dossier-content th,
    .dossier-content td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);

      text-align: left;
      vertical-align: top;

    .dossier-content th:last-child,
    .dossier-content td:last-child {
      border-right: 0;

    .dossier-content tbody tr:last-child td {

    @keyframes jourka-row-pulse {

      70% {

        box-shadow: inset 3px 0 0 var(--accent);
      }

      100% {
        background-color: transparent;
        box-shadow: inset 0 0 0 transparent;
      }

    .dossier-content tbody tr.is-row-highlight td {
      background-color: var(--accent-soft) !important;

    @media (prefers-reduced-motion: no-preference) {

        animation: jourka-row-pulse 1.4s ease-out 1;
      }

    .dossier-content th.col-align-left,
    .dossier-content td.col-align-left {

    }

    .dossier-content th.col-align-center,
    .dossier-content td.col-align-center {
      text-align: center;
    }

    .dossier-content th.col-align-right,
    .dossier-content td.col-align-right {
      text-align: right;
    }

    .dossier-section {
      min-width: 0;
      scroll-margin-top: calc(var(--toolbar-h) + 20px);
      border-radius: var(--radius-md);
    }

    @keyframes jourka-bento-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35);
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      70% {
        box-shadow: 0 0 0 8px rgba(37, 99, 235, 0);
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      100% {

        outline: 2px solid transparent;
        outline-offset: 4px;
      }

    @media (prefers-reduced-motion: no-preference) {

      .dossier-section.is-bento-highlight,
      .dossier-card.is-bento-highlight {
        animation: jourka-bento-pulse 1.2s ease-out 1;
      }

    /* Tier 1 Compact-First Section Accordions (JK-FE-006) */
    .dossier-content.dossier-content--cards {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;

    .dossier-preamble {

      border: 1px solid var(--border);

      box-shadow: var(--shadow-sm);
    }

    .dossier-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      scroll-margin-top: calc(var(--toolbar-h) + 20px);
      transition: border-color 160ms ease, box-shadow 160ms ease;

      background: var(--bg-surface);
      color: var(--ink-primary);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }

    .onboarding-tab-count {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--ink-muted-subtle);
    }

    .onboarding-tab[aria-selected="true"] .onboarding-tab-count {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .onboarding-panels {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .onboarding-panel[hidden] {
      display: none;
    }

    .dossier-content h3.onboarding-phase-title {
      margin: 0 0 10px 0;
      font-size: 0.9375rem;
      color: var(--ink-primary);
    }

    .dossier-content p.phase-focus {
      margin: 0 0 10px 0;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      font-size: 0.8125rem;
      color: var(--ink-primary);
    }

    .onboarding-checklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .check-item:hover {
      border-color: var(--accent);
    }

    .check-item.is-checked {
      background: var(--emerald-soft);
      border-color: var(--emerald);
    }

    .check-input {
      margin: 3px 0 0 0;
      inline-size: 17px;
      block-size: 17px;
      flex-shrink: 0;
      accent-color: var(--emerald);
      cursor: pointer;
    }

    .check-text {
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--ink-body);
      min-width: 0;
      flex: 1 1 auto;
    }

    .check-item.is-checked .check-text {
      color: var(--ink-muted-subtle);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    /* Mentor Deep-Dive Expander */
    .deepdive-block {
      margin: 10px 0;
    }

    .deepdive-rest> :first-child {
      margin-top: 8px;
    }

    .deepdive-rest> :last-child {
      margin-bottom: 8px;
    }

    .deepdive-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-control);
      background: var(--bg-subtle);
      color: var(--accent);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      min-block-size: 34px;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .deepdive-toggle:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* Semantic Verdict & AI Sentiment Callout Cards */
    .semantic-callout {
      margin: 14px 0;
      padding: 16px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      border-left-width: 4px;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .semantic-callout--verdict[data-verdict-tier="required"] {
      border-left-color: var(--rose);
      background: var(--rose-soft);
    }

    .semantic-callout--verdict[data-verdict-tier="preferred"],
    .semantic-callout--verdict[data-verdict-tier="neutral"] {
      border-left-color: var(--accent);
      background: var(--accent-soft);
    }

    .semantic-callout--verdict[data-verdict-tier="optional"] {
      border-left-color: var(--emerald);
      background: var(--emerald-soft);
    }

    .semantic-callout--ai {
      border-left-color: var(--amber);
      background: var(--amber-soft);
    }

    .callout-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .callout-header-main {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .callout-icon {
      inline-size: 28px;
      block-size: 28px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
    }

    .semantic-callout--verdict[data-verdict-tier="required"] .callout-icon {
      color: var(--rose-text);
    }

    .semantic-callout--verdict[data-verdict-tier="optional"] .callout-icon {
      color: var(--emerald-text);
    }

    .semantic-callout--ai .callout-icon {
      color: var(--amber-text);
    }

    .callout-icon svg {
      inline-size: 16px;
      block-size: 16px;
    }

    .dossier-content h3.callout-title {
      margin: 0;
      font-size: 0.96875rem;
      color: var(--ink-primary);
      min-width: 0;
    }

    .callout-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-size: 0.71875rem;
      font-weight: 700;
      color: var(--ink-primary);
      white-space: nowrap;
    }

    .semantic-callout--ai .callout-badge {
      color: var(--amber-text);
      border-color: var(--amber);
    }

    .semantic-callout--verdict[data-verdict-tier="required"] .callout-badge {
      color: var(--rose-text);
      border-color: var(--rose);
    }

    .semantic-callout--verdict[data-verdict-tier="optional"] .callout-badge {
      color: var(--emerald-text);
      border-color: var(--emerald);
    }

    .semantic-callout--verdict[data-verdict-tier="preferred"] .callout-badge {
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .callout-body> :first-child {
      margin-top: 0;
    }

    .callout-body> :last-child {
      margin-bottom: 0;
    }

    /* Footer */
    .app-footer {
      max-width: 1240px;
      margin-inline: auto;
      padding: 0 24px 36px 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-muted);
    }

    /* Mobile Floating TOC FAB & Native <dialog> Drawer */
    .toc-fab {
      display: none;
      position: fixed;
      inset-block-end: 20px;
      inset-inline-end: 20px;
      z-index: 95;
      align-items: center;
      gap: 8px;
      min-block-size: 48px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--ink-primary);
      color: var(--bg-surface);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }

    .toc-fab svg {
      inline-size: 18px;
      block-size: 18px;
    }

    dialog.toc-drawer {
      margin: auto auto 0 auto;
      inline-size: min(100vw, 560px);
      max-inline-size: 100vw;
      max-block-size: 78vh;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      background: var(--bg-surface);
      color: var(--ink-body);
      padding: 18px 20px 24px 20px;
      box-shadow: var(--shadow-md);
    }

    dialog.toc-drawer::backdrop {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--ink-primary);
    }

    /* Interactive Visualizations: Steppers, Citation Popovers & Filterable Tables (JK-FE-008) */
    .flow-stepper {
      margin: 16px 0;
      padding: 16px;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .flow-stepper-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .flow-stepper-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted-subtle);
    }

    .flow-raw-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-control);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      min-block-size: 30px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .flow-raw-toggle:hover {
      background: var(--bg-subtle);
      border-color: var(--accent);
    }

    .flow-raw-toggle[aria-expanded="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .flow-raw-toggle svg {
      inline-size: 14px;
      block-size: 14px;
      flex-shrink: 0;
    }

    .dossier-content ol.flow-stepper-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 10px 6px;
    }

    .flow-stepper[data-flow-orientation="vertical"] ol.flow-stepper-list {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .dossier-content li.flow-step-item {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 180px;
      min-width: 0;
    }

    .flow-stepper[data-flow-orientation="vertical"] li.flow-step-item {
      flex-direction: column;
      align-items: stretch;
      flex: 0 0 auto;
      gap: 4px;
    }

    .flow-step-card {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .flow-step-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .flow-step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.71875rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      line-height: 1.25;
      flex-shrink: 0;
    }

    .flow-step-meta-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--ink-muted-subtle);
      font-size: 0.6875rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .flow-step-title {
      font-size: 0.875rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink-primary);
      overflow-wrap: break-word;
    }

    .dossier-content ul.flow-step-details {
      margin: 2px 0 0 0;
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dossier-content ul.flow-step-details li {
      margin: 0;
      font-size: 0.78125rem;
      line-height: 1.45;
      color: var(--ink-body);
    }

    .flow-step-connector {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
      padding: 2px;
    }

    .flow-step-connector svg {
      inline-size: 18px;
      block-size: 18px;
    }

    .flow-stepper[data-flow-orientation="vertical"] .flow-step-connector {
      align-self: center;
      padding: 0;
    }

    .flow-stepper[data-flow-orientation="vertical"] .flow-step-connector svg {
      transform: rotate(90deg);
    }

    .flow-raw-wrap {
      margin-top: 12px;
    }

    .flow-raw-wrap[hidden] {
      display: none;
    }

    .flow-raw-wrap pre {
      margin: 0;
    }

    /* Inline Citation Chips & Floating Source Popover */
    .cite-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 3px;
      vertical-align: baseline;
    }

    .cite-chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 6px;
      margin: 0 1px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
      vertical-align: baseline;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .cite-chip--youtube {
      background: var(--rose-soft);
      color: var(--rose-text);
    }

    .cite-chip--abroad {
      background: var(--amber-soft);
      color: var(--amber-text);
    }

    .cite-chip:hover,
    .cite-chip[aria-expanded="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .cite-chip--youtube:hover,
    .cite-chip--youtube[aria-expanded="true"] {
      border-color: var(--rose);
      background: var(--rose);
      color: #ffffff;
    }

    .cite-chip--abroad:hover,
    .cite-chip--abroad[aria-expanded="true"] {
      border-color: var(--amber);
      background: var(--amber);
      color: #0f172a;
    }

    .cite-popover {
      position: fixed;
      inset-block-start: 0;
      inset-inline-start: 0;
      z-index: 150;
      width: min(360px, calc(100vw - 24px));
      background: var(--bg-surface);
      color: var(--ink-body);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cite-popover[hidden] {
      display: none;
    }

    .cite-popover-header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .cite-popover-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cite-popover[data-source-type="youtube"] .cite-popover-id {
      background: var(--rose-soft);
      color: var(--rose-text);
    }

    .cite-popover[data-source-type="abroad"] .cite-popover-id {
      background: var(--amber-soft);
      color: var(--amber-text);
    }

    .cite-popover-type {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.71875rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--ink-muted-subtle);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cite-popover-type svg {
      inline-size: 13px;
      block-size: 13px;
      flex-shrink: 0;
    }

    .cite-popover-close {
      appearance: none;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 28px;
      block-size: 28px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-muted-subtle);
      cursor: pointer;
      flex-shrink: 0;
    }

    .cite-popover-close:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .cite-popover-close svg {
      inline-size: 16px;
      block-size: 16px;
    }

    .cite-popover-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink-primary);
      overflow-wrap: break-word;
    }

    .cite-popover-context {
      margin: 0;
      font-size: 0.8125rem;
      line-height: 1.45;
      color: var(--ink-muted-subtle);
    }

    .cite-popover-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .cite-action {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-block-size: 32px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .cite-action--primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #ffffff;
    }

    .cite-action--primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .cite-action--secondary {
      background: var(--bg-subtle);
      border: 1px solid var(--border-control);
      color: var(--ink-primary);
    }

    .cite-action--secondary:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Filterable Table Toolbars & Semantic Demand Badges */
    .table-filter-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0 8px 0;
      padding: 12px 14px;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .table-filter-bar + .table-wrapper,
    .table-filter-bar + .table-scroll {
      margin-top: 0;
    }

    .table-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .filter-pill {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-block-size: 32px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--ink-muted-subtle);
      font-family: inherit;
      font-size: 0.78125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .filter-pill:hover {
      border-color: var(--accent);
      color: var(--ink-primary);
    }

    .filter-pill[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .filter-pill-count {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--ink-muted-subtle);
    }

    .filter-pill[aria-pressed="true"] .filter-pill-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .table-filter-search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 1 1 240px;
      max-inline-size: 380px;
      min-width: 0;
    }

    .table-filter-search-icon {
      position: absolute;
      inset-inline-start: 10px;
      display: inline-flex;
      color: var(--ink-muted);
      pointer-events: none;
    }

    .table-filter-search-icon svg {
      inline-size: 14px;
      block-size: 14px;
    }

    .table-filter-input {
      inline-size: 100%;
      min-block-size: 34px;
      padding: 6px 10px 6px 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-control);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.8125rem;
    }

    .table-filter-input::placeholder {
      color: var(--ink-muted);
    }

    .table-filter-count {
      font-size: 0.78125rem;
      font-weight: 600;
      color: var(--ink-muted-subtle);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      margin-left: auto;
    }

    .demand-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.35;
      border: 1px solid transparent;
    }

    .demand-badge--critical {
      background: var(--rose-soft);
      color: var(--rose-text);

      <textarea id="m" style="display:none;"># Mobile Engineer — Entry-Level Career Dossier (Indonesia)

## 1. Deskripsi Peran &amp; Ringkasan Eksekutif

Selamat datang di garis depan teknologi konsumen Indonesia. Sebagai seorang Mobile Engineer *entry-level* di Jakarta, Surabaya, Bandung, atau Yogyakarta, Anda sedang membangun fondasi digital dari salah satu ekonomi paling dinamis di Asia Tenggara. Di balik antarmuka aplikasi super (*superapps*) yang elegan seperti Grab [J02, J03], jaringan *quick-commerce* super cepat seperti Astro [J05], platform perjalanan yang sangat praktis seperti BookCabin [J08], hingga ekosistem fintech raksasa seperti Kredivo [J01], para *mobile engineer* bertugas mengubah logika bisnis yang rumit menjadi ketukan layar yang mulus, andal, dan menyenangkan. Saat jutaan pengguna Indonesia membuka aplikasi untuk memesan belanjaan tengah malam, mengajukan kredit instan, streaming media definisi tinggi di Vidio [J07], atau memesan tiket penerbangan secara mendadak, kode Anda-lah yang berdiri di antara rasa frustrasi dan kelancaran transaksi.

Hasil kerja harian Anda berdampak langsung pada tingkat retensi, rasio konversi, dan pendapatan perusahaan. Berbeda dengan pengembangan web di mana pengguna sering menikmati lingkungan desktop yang stabil dengan broadband serat optik berkecepatan tinggi, teknik *mobile* di Indonesia menuntut Anda untuk membangun perangkat lunak yang mampu bertahan dengan anggun di tengah koneksi 4G yang naik-turun di dalam kereta commuter yang bergerak, beroperasi mulus di perangkat Android kelas *budget* dengan RAM terbatas, serta menghemat kuota data seluler yang berharga. Tanggung jawab utama bagi seorang *mobile engineer entry-level* mencakup penulisan kode yang bersih dan modular untuk fitur-fitur berorientasi pengguna skala kecil hingga menengah [J01], perbaikan bug tata letak UI di berbagai dimensi layar, penulisan *unit test* yang kokoh untuk menangkap kasus-kasus ekstrem (*edge cases*) [J04], serta partisipasi aktif dalam *code review* bersama rekan-rekan senior [J01]. Anda akan berkolaborasi setiap hari dengan Product Manager yang merumuskan kebutuhan bisnis, Backend Engineer yang merancang REST dan GraphQL API, UI/UX Designer yang menyediakan prototipe Figma, serta Quality Assurance (QA) engineer yang menguji rilis Anda sebelum mendarat di Google Play Store dan Apple App Store.

### Putusan Pendidikan &amp; Gelar / Kualifikasi [S1/D4]

Di pasar teknologi Indonesia, memiliki gelar Sarjana (S1) atau Sarjana Terapan (D4) di bidang Ilmu Komputer, Teknik Informatika, Sistem Informasi, atau Teknik Elektro **Sangat Disukai** oleh perusahaan-perusahaan besar, *unicorn* fintech (seperti Kredivo dan Grab), serta korporasi institusional. Filter penyaringan SDM (*HR screening*) di perusahaan-perusahaan mayoritas sering kali menggunakan kualifikasi akademik sebagai tolok ukur awal. Kendati demikian, sektor teknologi di Indonesia semakin bersikap pragmatis: gelar akademik yang ketat *bukanlah* prasyarat mutlak secara hukum atau praktis jika Anda mampu mendemonstrasikan kemampuan eksekusi tingkat tinggi melalui portofolio yang siap diproduksi (*production-ready*).

Fondasi akademik utama yang berterima langsung dengan kesuksesan di tempat kerja mencakup struktur data dan algoritma, pemrograman berorientasi objek (*object-oriented programming*), manajemen konkurensi, dan dasar-dasar jaringan. Bagi pengembang otodidak, alumni *bootcamp*, atau mereka yang beralih jalur karier (*career switchers*) melalui Jalur Non-Gelar Alternatif, tiket masuk Anda adalah bukti kerja yang tak terbantahkan. Anda harus mengkompensasi ketiadaan gelar ilmu komputer formal dengan membangun aplikasi *mobile* *open-source* yang rapi dengan arsitektur bersih (MVVM atau Clean Architecture), mempublikasikan aplikasi fungsional ke *app store* publik, berkontribusi pada komunitas pengembang, serta menguasai perangkat *debugging* asli maupun lintas platform. Dalam teknik *mobile*, perangkat lunak yang berfungsi dan riwayat *git commit* yang bersih berbicara jauh lebih lantang daripada ijazah universitas.

## 2. Kebutuhan Kompetensi &amp; Keahlian Entry-Level

Untuk menembus kebisingan di pasar kerja Indonesia, Anda harus memahami apa yang secara aktif dicari oleh para manajer perekrutan (*hiring managers*). Berdasarkan analisis komprehensif kami terhadap lowongan pekerjaan *mobile engineering* baru-baru ini di perusahaan-perusahaan teknologi terkemuka di Jakarta [J01]–[J08], tabel di bawah ini merinci kompetensi esensial, kategori, tingkat permintaan pasar, serta pola penggunaan di dunia nyata.

| Kompetensi / Alat | Kategori | Tingkat Permintaan Pasar | Penggunaan Nyata di Tempat Kerja &amp; Alasan Kepentingannya | Kutipan Sumber |

| **Kotlin** | Bahasa Pemrograman (Android) | Kritis / Wajib | Standar mutlak untuk pengembangan Android native di seluruh fintech, quick-commerce, dan superapps di Indonesia; digunakan untuk membangun logika bisnis yang type-safe dan null-safe. | [J01], [J04], [J08] |

### Sudut Pandang Hiring Manager terhadap Kompetensi Inti

Saat mengevaluasi *mobile engineer entry-level*, saya mengabaikan daftar panjang kata kunci (*buzzwords*) di resume dan fokus pada tiga pilar fundamental yang memegang 80% bobot wawancara: kefasihan berbahasa, manajemen *state* UI, dan jaringan asinkron (*asynchronous networking*).

Pertama, Anda harus benar-benar nyaman dengan Kotlin (untuk Android) atau Swift (untuk iOS). Mengetahui sintaksis saja tidak cukup; Anda memerlukan pemahaman intuitif tentang *scope functions*, *lambdas*, *generics*, dan manajemen memori. Kedua, menguasai kerangka kerja UI deklaratif seperti Jetpack Compose atau SwiftUI adalah hal yang tidak bisa ditawar. UI imperatif tradisional memudar dengan cepat, dan aplikasi *mobile* modern sangat bergantung pada *reactive state hoisting* di mana UI bereaksi secara instan terhadap perubahan *state* ViewModel. Ketiga, Anda harus memahami bagaimana aplikasi *mobile* berkomunikasi dengan server *backend*—khususnya cara menangani serialisasi JSON, mengurai respons RESTful API, mengelola *coroutines* atau *thread async/await*, dan menangani *caching* lokal menggunakan Room atau SQLite.

Blind spot umum bagi pemula mencakup pengabaian manajemen siklus hidup (*lifecycle management*—berujung pada *memory leaks* dan *crash* aplikasi saat layar berputar), melakukan *hardcoding* dimensi UI alih-alih menggunakan *constraints* fleksibel untuk berbagai ukuran layar, serta mengabaikan penanganan kesalahan (*error handling*) untuk kegagalan jaringan. Di dunia nyata, API Anda *pasti* akan gagal ketika pengguna berjalan ke area parkir basement di SCBD; aplikasi Anda harus menangani situasi tersebut dengan elegan tanpa mengalami *crash*.

## 3. Peta Jalan Belajar &amp; Proyek Portofolio

```
[ Tahap 1: Fondasi Inti ] ---&gt; [ Tahap 2: Alur Kerja Produksi ] ---&gt; [ Tahap 3: Penyempurnaan &amp; Rilis ]
  • Penguasaan bahasa (Kotlin/Swift)   • Clean Architecture &amp; MVVM           • Automated Testing &amp; CI/CD
  • Layout UI dasar &amp; Navigasi        • REST API &amp; Caching Lokal (Room)     • Rilis Play Store / App Store
  • Git branching &amp; alur kerja PR     • Manajemen State (Compose/SwiftUI)   • Profiling Performa &amp; Memori
```

### Tahap 1: Fondasi Inti (Minggu 1–6)
Mulailah dengan menguasai bahasa pemrograman inti secara mendalam. Jika Anda memilih Android, selamilah sintaksis Kotlin, prinsip pemrograman berorientasi objek, serta konstruksi pemrograman fungsional seperti *collections* dan *higher-order functions*. Pelajari cara membangun antarmuka pengguna dasar menggunakan Jetpack Compose, dengan memahami *modifiers*, *rows*, *columns*, *lazy columns*, dan *state hoisting*. Secara bersamaan, kuasai kontrol versi Git: Anda harus fasih dalam *branching*, *committing*, menyelesaikan konflik penggabungan (*merge conflicts*), dan membuka Pull Request di GitHub.

### Tahap 2: Alur Kerja Produksi &amp; Arsitektur (Minggu 7–12)
Bergeraklah melampaui aplikasi tutorial sederhana dan pelajari bagaimana tim teknik profesional menyusun kode. Pelajari Clean Architecture dan pola Model-View-ViewModel (MVVM). Implementasikan Retrofit dan Kotlin Coroutines untuk mengambil data dari REST API langsung, menangani *loading states*, dan mengurai respons JSON menggunakan kotlinx.serialization. Implementasikan persistensi data lokal menggunakan database Room sehingga aplikasi Anda dapat bekerja secara offline. Pelajari cara navigasi antar berbagai layar menggunakan Jetpack Navigation dan meneruskan argumen dengan aman.

### Tahap 3: Penyempurnaan, Pengujian &amp; Rilis (Minggu 13–16)
Kode berstandar perusahaan (*enterprise-grade*) memerlukan pengujian ketat dan pengiriman otomatis. Pelajari cara menulis pengujian JUnit untuk ViewModel Anda dan gunakan MockK untuk mem-mock dependensi jaringan. Biasakan diri Anda dengan konsep dasar CI/CD dengan menyiapkan GitHub Actions untuk secara otomatis melakukan *linting* dan *build* pada setiap *commit*. Terakhir, pelajari cara menghasilkan APK/AAB rilis yang bertanda tangan (*signed release*), mengonfigurasi obfuscation kode ProGuard/R8, dan mempublikasikan aplikasi yang sudah jadi ke *internal testing track* di Google Play Console.

### Desain Cetak Biru Proyek Portofolio Nyata

#### Cetak Biru A: Aplikasi Simulator E-Wallet &amp; QRIS Indonesia
*   **Pernyataan Masalah:** Pengguna membutuhkan aplikasi dompet digital simulasi yang menangani transaksi mata uang lokal, menampilkan kode QRIS dinamis, dan mempertahankan buku besar riwayat transaksi offline.
*   **Tech Stack:** Kotlin, Jetpack Compose, Room Database, Room, Retrofit, Coroutines, Hilt Dependency Injection.
*   **Arsitektur Alur Kerja:** Menerapkan MVVM dengan pola Repository. Database Room lokal bertindak sebagai sumber kebenaran tunggal (*single source of truth*) untuk riwayat transaksi, disinkronkan dengan *mock backend* via Retrofit.
*   **Kriteria Evaluasi:** Pemisahan *concern* yang bersih, tidak ada *UI jank* saat pengguliran daftar (*list scrolling*), *caching* offline yang andal, dan pengujian unit yang komprehensif untuk logika perhitungan saldo dompet.

#### Cetak Biru B: Klien Marketplace Pengiriman Makanan On-Demand
*   **Pernyataan Masalah:** Konsumen membutuhkan katalog pengiriman makanan performa tinggi dengan penyaringan pencarian waktu nyata, kustomisasi menu restoran, dan persistensi state keranjang belanja.
*   **Tech Stack:** Flutter (Dart), manajemen state Provider / Riverpod, klien HTTP Dio, penyimpanan lokal Hive.
*   **Arsitektur Alur Kerja:** Arsitektur berlapis berbasis fitur (*feature-first*) yang memastikan modularitas dan kemampuan uji independen untuk modul keranjang dan *checkout*.
*   **Kriteria Evaluasi:** Animasi navigasi yang mulus, tata letak responsif di berbagai rasio aspek ponsel, penanganan kesalahan yang elegan untuk koneksi jaringan yang terputus, dan pohon widget (*widget trees*) yang bersih serta mudah dibaca.

#### Cetak Biru C: Pelacak Transit Commuter &amp; Jadwal
*   **Pernyataan Masalah:** Para komuter harian membutuhkan penampil jadwal berbasis *offline-first* untuk rute transportasi lokal dengan dukungan penandaan favorit dan mode gelap (*dark mode*).
*   **Tech Stack:** Swift, SwiftUI, Combine, CoreData.
*   **Arsitektur Alur Kerja:** Arsitektur MVVM yang memanfaatkan *Combine publishers* untuk pengikatan data reaktif (*reactive data binding*) antara model data jadwal dan tampilan SwiftUI.
*   **Kriteria Evaluasi:** Kode Swift yang idiomatik, kepatuhan terhadap Pedoman Antarmuka Manusia Apple (*Apple Human Interface Guidelines*), interaksi gestur yang cair, dan nol *memory leaks* yang diverifikasi via Instruments.

### Pengalaman Hidup Nyata Seorang Mobile Engineer Entry-Level

Melangkah ke kantor teknologi di Jakarta pada pukul 08:45 pagi memicu ritme kerja berenergi tinggi. Setelah mengambil secangkir kopi susu lokal, Anda duduk di meja kerja dan membuka Slack serta Jira untuk memeriksa lansiran *build* semalam. Tepat pukul 09:00 pagi, skuad Anda berkumpul untuk *daily standup*. Anda membagikan progres Anda pada tiket fitur kemarin—mungkin layar penukaran voucher baru—dan menyebutkan bahwa Anda sedang menunggu titik akhir API (*endpoint*) yang diselesaikan oleh tim *backend*.

Pagi hari adalah tempat perlindungan Anda untuk bekerja secara mendalam (*deep work*). Berbekal *headphone* peredam kebisingan, Anda menyelami IDE Anda (Android Studio atau Xcode). Anda menulis kode UI deklaratif di Jetpack Compose atau SwiftUI, mengikat *stream* data reaktif ke tampilan Anda. Sekitar pukul 11:30 siang, Anda menjalankan *build* lokal pada emulator dan perangkat uji fisik, hanya untuk menyadari laju bingkai (*frame rate*) yang lambat saat menggulir daftar yang panjang. Anda menyalakan *profiler*, mengidentifikasi lingkaran *recomposition* yang tidak perlu, mengoptimalkan *keys* Anda, dan menyelesaikan masalah tersebut.

Setelah makan siang, sore hari bergeser ke arah kolaborasi. Anda menarik (*pull*) Pull Request rekan setim dan melakukan *code review* secara menyeluruh, memeriksa adanya kebocoran memori, konvensi penamaan yang bersih, dan penanganan kesalahan yang tepat. Belakangan, seorang *engineer* QA menghubungi Anda mengenai bug di mana aplikasi mengalami *crash* saat beralih status jaringan selama *checkout*. Anda melompat ke sesi obrolan singkat, melacak *exception handler* coroutine, menambal *crash* tersebut, dan mendorong (*push*) *commit* yang diperbarui. Menjelang akhir hari kerja pada pukul 17:30 sore, Anda memperbarui papan Jira Anda, mendorong cabang akhir Anda ke GitHub, dan meninjau tujuan Anda untuk besok.

## 5. Estimasi Gaji Awal &amp; Peta Perjalanan Karier

Kompensasi di sektor teknologi Indonesia bervariasi secara signifikan tergantung pada skala perusahaan, pendanaan, dan vertikal industri. Angka-angka di bawah ini mencerminkan gaji kotor bulanan dalam Rupiah (IDR), mencakup gaji pokok sebelum pemotongan.

| Tingkat / Jenis Perusahaan | Entry-Level (0–1 thn) | Junior (1–2 thn) | Mid-Level (2–4 thn) |
| :--- | :--- | :--- | :--- |
| **[a] Startup Lokal / UKM / Agensi Butik** | IDR 6,000,000 – 9,000,000 | IDR 9,000,000 – 13,000,000 | IDR 13,000,000 – 20,000,000 |
| **[b] Perusahaan Menengah Terkemuka / Konsultansi** | IDR 9,000,000 – 13,000,000 | IDR 13,000,000 – 18,000,000 | IDR 18,000,000 – 26,000,000 |
| **[c] Unicorn Papan Atas / Multinasional (cth. Grab, Kredivo)** | IDR 13,000,000 – 18,000,000 | IDR 18,000,000 – 26,000,000 | IDR 26,000,000 – 40,000,000+ |

### Memahami Gaji Bersih di Indonesia
Saat mengevaluasi angka gaji ini, ingatlah bahwa gaji kotor tunduk pada potongan wajib undang-undang. Berdasarkan peraturan ketenagakerjaan Indonesia, pemberi kerja harus mendaftarkan Anda ke **BPJS Ketenagakerjaan** (Jaminan Sosial mencakup hari tua, pensiun, dan asuransi kecelakaan kerja) serta **BPJS Kesehatan** (layanan kesehatan nasional). Pajak penghasilan (**PPh 21**) dihitung secara progresif berdasarkan penghasilan kena pajak tahunan Anda, disesuaikan dengan ambang batas PTKP (Penghasilan Tidak Kena Pajak). Selain itu, karyawan tetap berhak secara hukum atas bonus **Tunjangan Hari Raya (THR)**—yang setara dengan gaji satu bulan—yang dibayarkan sebelum Idul Fitri.

```
[Entry-Level: 0-1 thn] ---&gt; [Junior: 1-2 thn] ---&gt; [Mid-Level: 2-4 thn] ---&gt; [Senior: 4-7 thn] ---&gt; [Lead / Manager: 7+ thn]
  • Fokus: Eksekusi fitur        • Fokus: Pengiriman mandiri    • Fokus: Arsitektur &amp; mentoring  • Fokus: Desain sistem &amp; lintas org • Fokus: Strategi teknik
  • Dibimbing setiap hari       • Fitur minor otonom          • Menguasai modul/layanan besar  • Mengemudi standar teknis          • Mengelola organisasi teknik
```

### Peta Perjalanan Karier
1.  **Mobile Engineer Entry-Level (0–1 tahun):** Cakupan kerja Anda berpusat pada pengimplementasian komponen UI yang terdefinisi dengan baik, memperbaiki bug minor [J01], dan menulis unit test di bawah bimbingan ketat mentor senior. Pola pikir Anda harus seperti spons: serap umpan balik *code review* dengan penuh semangat dan pelajari bagaimana sistem produksi berskala besar bekerja.
2.  **Junior Mobile Engineer (1–2 tahun):** Anda mengambil kepemilikan atas fitur skala kecil hingga menengah dari desain hingga rilis [J01]. Anda memahami cara mengintegrasikan REST API yang kompleks, melakukan *debugging* masalah *threading* asinkron, dan berkolaborasi secara mulus dengan tim desain dan *backend*.
3.  **Mid-Level Mobile Engineer (2–4 tahun):** Anda merancang seluruh modul aplikasi, membimbing anak magang dan *junior* yang baru masuk, mengoptimalkan kinerja aplikasi di berbagai spesifikasi perangkat, dan berkontribusi aktif pada peningkatan *pipeline* CI/CD [J07].
4.  **Senior Mobile Engineer (4+ tahun):** Anda merancang arsitektur sistem yang sangat penting (*mission-critical*), mengarahkan inisiatif migrasi lintas platform (seperti Kotlin Multiplatform [J07]), membereskan utang teknis organisasi [J04], dan menyelaraskan strategi teknik *mobile* dengan tujuan bisnis perusahaan secara lebih luas.

## 6. Panduan Karier: Pro, Kontra, Sentimen AI &amp; Realita Industri

| Kelebihan (Pros) | Kekurangan (Cons) |
| :--- | :--- |
| **Dampak Nyata yang Tinggi:** Kode Anda berjalan langsung di tangan jutaan pengguna aktif harian di Indonesia. | **Fragmentasi Perangkat:** Menghadapi kinerja perangkat yang tidak menentu dan bug rendering UI di berbagai perangkat Android murah. |
| **Kurva Pertumbuhan Menguntungkan:** Pertumbuhan gaji yang cepat dan permintaan pasar yang tinggi di pusat-pusat teknologi dan fintech di Jakarta. | **Kelelahan Ekosistem yang Cepat:** Kerangka kerja, alat build, and versi OS terus diperbarui tanpa henti, menuntut pembelajaran mandiri yang konstan. |
| **Budaya Kolaboratif yang Kuat:** Kerja sama lintas fungsi yang erat dengan product managers, desainer, dan QA engineers [J01]. | **Siklus Rilis Bertekanan Tinggi:** Tenggat waktu peluncuran produk yang ketat, terutama menjelang festival belanja utama (misalnya Harbolnas, Ramadan). |

### Sentimen AI &amp; Prospek Masa Depan
Alat kecerdasan buatan seperti GitHub Copilot, ChatGPT, dan Claude telah secara fundamental mengubah rekayasa *mobile*, tetapi mereka *belum* menggantikan para *mobile engineer*. Di pasar teknologi Indonesia, AI telah menggeser ekspektasi perekrutan dari penulisan *boilerplate* rutin—seperti menghasilkan adaptor RecyclerView dasar, *data classes* sederhana, atau panggilan jaringan *boilerplate*—menuju kapabilitas teknik tingkat tinggi.

Sebagai seorang *engineer entry-level* saat ini, Anda diharapkan menggunakan AI sebagai akselerator cerdas untuk merancang kode lebih cepat, tetapi Anda harus memiliki penilaian arsitektural untuk meninjau, melakukan *debugging*, dan mengamankan kode tersebut. Asisten AI sangat kesulitan menghadapi basis kode warisan (*legacy codebases*) yang kompleks dan berpemilik, kasus ekstrem manajemen *state* kustom, dan kondisi *race conditions* konkurensi yang halus. Ketahanan karier jangka panjang Anda bergantung pada penguasaan prinsip-prinsip ilmu komputer fundamental, arsitektur sistem, penguasaan *debugging*, dan empati manusia dalam desain produk—area di mana kecerdasan buatan generatif tetap sekadar menjadi asisten pendukung.

### Realita Industri yang Jujur &amp; Siapa yang Berkembang vs. Siapa yang Terpuruk
Mari kita bicara secara jujur. Putaran wawancara teknologi di Indonesia untuk rekayasa *mobile* tergolong ketat. Harapkan beberapa putaran yang mencakup pengodean langsung (Struktur Data &amp; Algoritma), desain sistem khusus *mobile* (misalnya, &quot;Rancang layar pelacakan pesanan Gojek&quot;), dan pengujian teknis mendalam tentang manajemen memori Kotlin/Swift.

*   **Siapa yang Berkembang:** Junior yang menyikapi umpan balik dengan kerendahan hati, mempertahankan rasa ingin tahu yang gigih, membangun proyek pribadi di luar jam kantor, dan terobsesi dengan kualitas kode. Mereka membaca dokumentasi daripada sekadar menyalin cuplikan dari StackOverflow secara membabi buta.
*   **Siapa yang Terpuruk:** Kandidat yang memperlakukan teknik *mobile* sebagai latihan UI *drag-and-drop* yang sederhana, panik saat dihadapkan pada kode warisan yang tidak dikenal, menolak kritik *code review*, dan gagal memahami dasar-dasar jaringan asinkron. Jika Anda bersedia merangkul proses *debugging* sebagai sebuah teka-teki alih-alih beban kerja, Anda akan membangun karier yang luar biasa memuaskan di sini.

## 7. Rencana Aksi Onboarding 30 / 60 / 90 Hari Pertama

### Hari 1–30: Pengaturan Lingkungan, Membaca &amp; Kemenangan Kecil Pertama
*   **Ruang Kerja &amp; Akses:** Siapkan mesin pengembangan Anda, instal Android Studio / Xcode, konfigurasikan kunci SSH, dan dapatkan token akses untuk repositori internal GitHub, Jira, dan Slack.
*   **Penyelaman Basis Kode:** Kloning repositori *mobile* utama perusahaan. Baca dokumentasi arsitektur, jelajahi struktur direktori proyek, dan lacak bagaimana permintaan jaringan mengalir dari komponen UI ke sumber data lokal.
*   **Kemenangan Kecil Pertama:** Ambil 2 hingga 3 tiket &quot;Good First Issue&quot; yang ditugaskan oleh mentor Anda—seperti memperbaiki bug padding UI kecil, memperbarui sumber daya string yang dilokalisasi, atau menulis unit test yang hilang untuk kelas utilitas.

### Hari 31–60: Eksekusi Mandiri &amp; Membangun Kepercayaan Tim
*   **Kepemilikan Fitur:** Ambil kepemilikan atas tiket fitur skala kecil hingga menengah pertama Anda [J01]. Rancang layar UI bekerja sama dengan tim desain, implementasikan logika bisnis, dan tulis unit test yang bersih.
*   **Keterlibatan Code Review:** Berpartisipasi aktif dalam Pull Request. Kirimkan PR Anda sendiri dengan deskripsi yang jelas dan panduan loom, serta tanggapi secara konstruktif umpan balik *code review* dari insinyur senior.
*   **Sinkronisasi Lintas Fungsi:** Hadiri sesi penyempurnaan produk dan rapat triase QA. Pelajari cara mengestimasi kompleksitas tiket secara akurat dan mengomunikasikan hambatan teknis lebih awal kepada manajer teknik Anda.

### Hari 61–90: Kepemilikan End-to-End &amp; Lulus Masa Percobaan dengan Gemilang
*   **Pengiriman Otonom:** Kirimkan modul fitur lengkap secara mandiri mulai dari *sprint grooming* hingga penerapan produksi dan pemantauan.
*   **Performa &amp; Stabilitas:** Pelajari cara memantau laporan crashlytics (Firebase Crashlytics / Sentry), selidiki ANR (Application Not Responding), dan perbaiki *memory leaks* secara proaktif.
*   **Ulasan Masa Percobaan (Probation):** Susun ringkasan tiket yang telah Anda kirimkan, *code review* yang dilakukan, dan kontribusi pada dokumentasi tim. Sampaikan ini selama ulasan masa percobaan 90 hari Anda dengan percaya diri, mengamankan posisi permanen Anda sebagai anggota berharga dari tim *mobile engineering*.

      function getSystemTheme() {

      function getTheme() {

      function setTheme(nextTheme, persist) {
        var resolved = nextTheme === 'dark' ? 'dark' : 'light';
        docEl.setAttribute('data-theme', resolved);
        var meta = document.querySelector('meta[name="color-scheme"]');
        var btn = document.getElementById('theme-toggle');
        if (btn) btn.setAttribute('aria-pressed', resolved === 'dark' ? 'true' : 'false');
        if (persist) {
          var sys = getSystemTheme();
          try {
            if (resolved !== sys) {
              localStorage.setItem('jourka_theme', resolved);
              if (meta) meta.setAttribute('content', resolved);
            } else {
              localStorage.removeItem('jourka_theme');
              if (meta) meta.setAttribute('content', 'light dark');
            }
          } catch (e) {
            if (meta) meta.setAttribute('content', resolved);
          }
        }
      }

      function initReadingProgressFallback() {
        var supportsTimeline = false;

        if (supportsTimeline) return;

        var ticking = false;
        var update = function () {
          ticking = false;
          var scrollable = document.documentElement.scrollHeight - window.innerHeight;
          var ratio = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 0;
          bar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
        };
        var schedule = function () {
          if (!ticking) {
            ticking = true;
            window.requestAnimationFrame(update);
          }
        };
        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule, { passive: true });
        update();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function splitPipeCells(line) {
        var trimmed = line.trim();
        if (trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
        if (trimmed.length > 0 && trimmed.charAt(trimmed.length - 1) === '|' && trimmed.charAt(trimmed.length - 2) !== '\\') {
          trimmed = trimmed.slice(0, -1);
        }
        var cells = [];
        var buf = '';
        var inCode = false;
        for (var i = 0; i < trimmed.length; i++) {
          var ch = trimmed.charAt(i);
          if (ch === '\\' && i + 1 < trimmed.length && trimmed.charAt(i + 1) === '|') {
            buf += '\\|';
            i++;
            continue;
          }
          if (ch === '`') {
            inCode = !inCode;
            buf += ch;
            continue;
          }
          if (ch === '|' && !inCode) {
            cells.push(buf.trim());
            buf = '';
            continue;
          }
          buf += ch;
        }
        cells.push(buf.trim());
        return cells;
      }

      function isTableSeparatorLine(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line) ||
          /^\s*\|\s*:?-{3,}:?\s*\|\s*$/.test(line);
      }

      function normalizeMarkdownInput(rawMd) {
        var text = String(rawMd || '');
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        var lines = text.split('\n');
        var out = [];
        var inFence = false;
        var fenceChar = '';
        var fenceLen = 0;
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];
          var fenceMatch = line.match(/^\s*(```+|~~~+)/);
          if (fenceMatch) {
            var marker = fenceMatch[1];
            if (!inFence) {
              inFence = true;
              fenceChar = marker.charAt(0);
              fenceLen = marker.length;
            } else if (marker.charAt(0) === fenceChar && marker.length >= fenceLen && line.trim().length === marker.length) {
              inFence = false;
            }
            out.push(line);
            i++;
            continue;
          }

          if (!inFence && i + 1 < lines.length && line.indexOf('|') !== -1 && isTableSeparatorLine(lines[i + 1])) {
            var hdrCells = splitPipeCells(line);
            var sepCells = splitPipeCells(lines[i + 1]);
            if (hdrCells.length >= 2 && sepCells.length === hdrCells.length) {
              var colCount = hdrCells.length;
              out.push(line);
              out.push(lines[i + 1]);
              i += 2;
              while (i < lines.length) {
                var rowLine = lines[i];
                if (!rowLine.trim() || rowLine.indexOf('|') === -1 || /^\s*(```+|~~~+|#{1,6}\s|>\s?)/.test(rowLine)) {
                  break;
                }
                var rowCells = splitPipeCells(rowLine);
                if (rowCells.length > colCount) {
                  var fixed;
                  if (colCount >= 4) {
                    var tailCount = colCount - 3;
                    var titleEnd = rowCells.length - tailCount;
                    var mergedTitle = rowCells.slice(2, titleEnd).join(' \\| ');
                    fixed = [rowCells[0], rowCells[1], mergedTitle].concat(rowCells.slice(titleEnd));
                  } else {
                    fixed = rowCells.slice(0, colCount - 1).concat([rowCells.slice(colCount - 1).join(' \\| ')]);
                  }
                  out.push('| ' + fixed.join(' | ') + ' |');
                } else {
                  out.push(rowLine);
                }
                i++;
              }
              continue;
            }
          }

          out.push(line);
          i++;
        }

        return out.join('\n');
      }

      function formatInlineText(text, allowLinks) {
        var tokens = [];
        function stash(html) {
          var id = '\u0007JKTOK' + tokens.length + '\u0007';
          tokens.push(html);
          return id;
        }

        var s = String(text || '');

        s = s.replace(/\\([\\`*_{}[\]()#+\-.!|])/g, function (_, ch) {
          return stash(escapeHtml(ch));
        });

        s = s.replace(/(`+)([\s\S]*?)\1/g, function (_, _ticks, code) {
          return stash('<code>' + escapeHtml(code.trim()) + '</code>');
        });

        if (allowLinks) {
          var linked = '';
          var pos = 0;
          while (pos < s.length) {
            var openIdx = s.indexOf('[', pos);
            if (openIdx === -1) {
              linked += s.slice(pos);
              break;
            }
            var closeBracket = -1;
            var depthB = 0;
            for (var bi = openIdx; bi < s.length; bi++) {
              if (s.charAt(bi) === '[') depthB++;
              else if (s.charAt(bi) === ']') {
                depthB--;
                if (depthB === 0) {
                  closeBracket = bi;
                  break;
                }
              }
            }
            if (closeBracket === -1 || s.charAt(closeBracket + 1) !== '(') {
              linked += s.slice(pos, openIdx + 1);
              pos = openIdx + 1;
              continue;
            }
            var urlStart = closeBracket + 2;
            var closeParen = -1;
            var depthP = 1;
            for (var pi = urlStart; pi < s.length; pi++) {
              var pc = s.charAt(pi);
              if (pc === '(') depthP++;
              else if (pc === ')') {
                depthP--;
                if (depthP === 0) {
                  closeParen = pi;
                  break;
                }
              }
            }
            if (closeParen === -1) {
              linked += s.slice(pos, openIdx + 1);
              pos = openIdx + 1;
              continue;
            }
            var labelRaw = s.slice(openIdx + 1, closeBracket);
            var hrefRaw = s.slice(urlStart, closeParen).trim();
            var titleMatch = hrefRaw.match(/^([^\s]+)\s+"([^"]*)"$/);
            var cleanHref = titleMatch ? titleMatch[1] : hrefRaw;
            var linkTitle = titleMatch ? ' title="' + escapeHtml(titleMatch[2]) + '"' : '';
            linked += s.slice(pos, openIdx) + stash(
              '<a href="' + escapeHtml(cleanHref) + '"' + linkTitle + '>' + formatInlineText(labelRaw, false) + '</a>'
            );
            pos = closeParen + 1;
          }
          s = linked;
        }

        s = escapeHtml(s);
        s = s.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/(^|[^\w])__([^\n]+?)__(?=[^\w]|$)/g, '$1<strong>$2</strong>');
        s = s.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
        s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
        s = s.replace(/(^|[^\w])_([^_\n]+?)_(?=[^\w]|$)/g, '$1<em>$2</em>');

        var guard = 0;
        while (s.indexOf('\u0007JKTOK') !== -1 && guard < 10) {
          s = s.replace(/\u0007JKTOK(\d+)\u0007/g, function (_, idx) {
            return tokens[Number(idx)] || '';
          });
          guard++;
        }
        return s;
      }

      function fallbackMarkdownToHtml(rawMd) {
        var md = normalizeMarkdownInput(rawMd);
        if (!md.trim()) return '';

        var lines = md.split('\n');
        var html = [];
        var i = 0;

        function isBlockBoundary(idx) {
          if (idx >= lines.length) return true;
          var ln = lines[idx];
          if (!ln.trim()) return true;
          if (/^\s*(```+|~~~+)/.test(ln)) return true;
          if (/^\s*#{1,6}\s+/.test(ln)) return true;
          if (/^\s*(?:-\s*){3,}$|^\s*(?:\*\s*){3,}$|^\s*(?:_\s*){3,}$/.test(ln)) return true;
          if (/^\s*>\s?/.test(ln)) return true;
          if (/^\s*(?:[-*+]|\d+[.)])\s+/.test(ln)) return true;
          if (idx + 1 < lines.length && ln.indexOf('|') !== -1 && isTableSeparatorLine(lines[idx + 1])) return true;
          return false;
        }

        while (i < lines.length) {
          var line = lines[i];

          if (!line.trim()) {
            i++;
            continue;
          }

          var fenceMatch = line.match(/^\s*(```+|~~~+)\s*([a-zA-Z0-9_-]*)/);
          if (fenceMatch) {
            var fChar = fenceMatch[1].charAt(0);
            var fLen = fenceMatch[1].length;
            var fLang = fenceMatch[2] || '';
            var codeLines = [];
            i++;
            while (i < lines.length) {
              var endMatch = lines[i].match(/^\s*(```+|~~~+)\s*$/);
              if (endMatch && endMatch[1].charAt(0) === fChar && endMatch[1].length >= fLen) {
                i++;
                break;
              }
              codeLines.push(lines[i]);
              i++;

      function extractCoreCompetencies(skillsSection, langCode) {

      function parseIdrAmounts(text) {

      function extractEvidenceCounts(evidenceSection, allSections, langCode) {

      function buildBentoCard(opts) {

      function slugifyRole(name) {
